      note: {en: "Job offer in a designated clerical or service occupation; usually a Korean associate degree, a bachelor's or 3+ years' experience (a few jobs accept a licence or a recognised cooking-competition award instead); salary of at least ₩25.9M (2026). In Korea, unless you are a citizen of the UK, France, Ireland, Denmark, Chile, Italy, Israel or Belgium.", ru: 'Предложение работы по определённой офисной или сервисной профессии; обычно корейский диплом колледжа, диплом бакалавра или 3+ года опыта (в некоторых профессиях вместо этого принимают лицензию или призовое место на признанном кулинарном конкурсе); зарплата от ₩25,9 млн (2026). В Корее — кроме граждан Великобритании, Франции, Ирландии, Дании, Чили, Италии, Израиля и Бельгии.', uz: 'Belgilangan ofis yoki xizmat ko‘rsatish kasbi bo‘yicha ish taklifi; odatda Koreya kolleji diplomi, bakalavr diplomi yoki 3+ yil tajriba (ayrim kasblarda buning o‘rniga litsenziya yoki tan olingan oshpazlik tanlovidagi sovrinli o‘rin qabul qilinadi); ish haqi kamida ₩25,9 mln (2026). Koreyada — Buyuk Britaniya, Fransiya, Irlandiya, Daniya, Chili, Italiya, Isroil va Belgiya fuqarolaridan tashqari.', uz-cyrl: 'Белгиланган офис ёки хизмат кўрсатиш касби бўйича иш таклифи; одатда Корея коллежи дипломи, бакалавр дипломи ёки 3+ йил тажриба (айрим касбларда бунинг ўрнига лицензия ёки тан олинган ошпазлик танловидаги совринли ўрин қабул қилинади); иш ҳақи камида ₩25,9 млн (2026). Кореяда — Буюк Британия, Франция, Ирландия, Дания, Чили, Италия, Исроил ва Белгия фуқароларидан ташқари.'}
    - to: E-7-3
      abroadFor: h1NoChange
      note: {en: 'Job offer in a designated skilled trade (for example welder or aquaculture technician); salary of at least ₩25.9M. In Korea, unless you are a citizen of the UK, France, Ireland, Denmark, Chile, Italy, Israel or Belgium.', ru: 'Предложение работы по определённой рабочей специальности (например, сварщик, техник аквакультуры); зарплата от ₩25,9 млн. В Корее — кроме граждан Великобритании, Франции, Ирландии, Дании, Чили, Италии, Израиля и Бельгии.', uz: 'Belgilangan ishchi kasbi bo‘yicha ish taklifi (masalan, payvandchi, akvakultura texnigi); ish haqi kamida ₩25,9 mln. Koreyada — Buyuk Britaniya, Fransiya, Irlandiya, Daniya, Chili, Italiya, Isroil va Belgiya fuqarolaridan tashqari.', uz-cyrl: 'Белгиланган ишчи касби бўйича иш таклифи (масалан, пайвандчи, аквакультура техниги); иш ҳақи камида ₩25,9 млн. Кореяда — Буюк Британия, Франция, Ирландия, Дания, Чили, Италия, Исроил ва Белгия фуқароларидан ташқари.'}
