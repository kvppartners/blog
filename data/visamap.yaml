    how: {en: 'Multiple-entry visit visa for ethnic Koreans of any nationality; up to 90 days per stay, no work.', ru: 'Многократная виза для этнических корейцев любого гражданства; до 90 дней за въезд, без работы.', uz: 'Har qanday fuqarolikdagi etnik koreyslar uchun ko‘p martalik viza; har safar 90 kungacha, ishlash mumkin emas.', uz-cyrl: 'Ҳар қандай фуқароликдаги этник корейслар учун кўп марталик виза; ҳар сафар 90 кунгача, ишлаш мумкин эмас.'}
