  D-2-7:
    name: {en: Scholarship student (GKS etc.), ru: Стипендиат (GKS и др.), uz: Stipendiyachi talaba (GKS va boshqalar), uz-cyrl: Стипендиячи талаба (GKS ва бошқалар)}
    how: {en: "A regular Korean degree course (associate to doctorate) on a full scholarship: a GKS government scholarship, a foreign government's full-tuition scholarship, or a university's full-tuition STEM scholarship.", ru: 'Программа с получением степени в корейском вузе (от колледжа до докторантуры) на полной стипендии: государственная стипендия GKS, стипендия иностранного правительства с полной оплатой обучения или стипендия вуза с полной оплатой обучения по STEM.', uz: 'To‘liq stipendiya bilan Koreyada daraja beruvchi dasturda (kollejdan doktoranturagacha) o‘qish: GKS davlat stipendiyasi, xorijiy hukumatning o‘qish to‘lovini to‘liq qoplaydigan stipendiyasi yoki universitetning STEM bo‘yicha o‘qish to‘lovini to‘liq qoplaydigan stipendiyasi.', uz-cyrl: 'Тўлиқ стипендия билан Кореяда даража берувчи дастурда (коллеждан докторантурагача) ўқиш: GKS давлат стипендияси, хорижий ҳукуматнинг ўқиш тўловини тўлиқ қоплайдиган стипендияси ёки университетнинг STEM бўйича ўқиш тўловини тўлиқ қоплайдиган стипендияси.'}
