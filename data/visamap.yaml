    how: {en: '5+ years on D-7–E-7 or F-2, age 19+, income of 2× GNI (or assets of 1.5× average) and KIIP level 5; E-7 holders need a bachelor''s degree.', ru: '5+ лет в статусах D-7–E-7 или F-2, возраст 19+, доход 2× ВНД (или активы 1,5× от среднего) и KIIP 5; для E-7 нужен диплом бакалавра.', uz: 'D-7–E-7 yoki F-2 da 5+ yil, yosh 19+, daromad 2× GNI (yoki aktivlar o‘rtachadan 1,5×) va KIIP 5; E-7 egalariga bakalavr diplomi kerak.', uz-cyrl: 'D-7–E-7 ёки F-2 да 5+ йил, ёш 19+, даромад 2× GNI (ёки активлар ўртачадан 1,5×) ва KIIP 5; E-7 эгаларига бакалавр дипломи керак.'}
