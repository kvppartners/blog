      text: {en: 'For your nationality, a long-term visa needs a tuberculosis test certificate from a hospital approved by the Korean embassy.', ru: 'Для вашего гражданства на долгосрочную визу нужна справка об обследовании на туберкулёз из больницы, одобренной посольством Кореи.', uz: Fuqaroligingiz uchun uzoq muddatli vizaga Koreya elchixonasi tasdiqlagan shifoxonadan sil kasalligi tekshiruvi haqida ma’lumotnoma kerak., uz-cyrl: Фуқаролигингиз учун узоқ муддатли визага Корея элчихонаси тасдиқлаган шифохонадан сил касаллиги текшируви ҳақида маълумотнома керак.}
