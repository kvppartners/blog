    how: {en: 'Outstanding ability in science, business, education, arts or sport, proven by a points test.', ru: 'Выдающиеся достижения в науке, бизнесе, образовании, искусстве или спорте, подтверждённые балльной оценкой.', uz: 'Fan, biznes, ta’lim, san’at yoki sportda alohida qobiliyat, ball tizimi bilan tasdiqlangan.', uz-cyrl: 'Фан, бизнес, таълим, санъат ёки спортда алоҳида қобилият, балл тизими билан тасдиқланган.'}
