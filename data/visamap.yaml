    how: {en: F-4 holder settling in a depopulating area with a local-government recommendation; people moving there must be under 60., ru: 'Обладатель F-4, переселяющийся в депопулирующий район по рекомендации местных властей; переезжающим — до 60 лет.', uz: Mahalliy hokimiyat tavsiyasi bilan aholisi kamayayotgan hududga ko‘chgan F-4 egasi; ko‘chib keluvchilar 60 yoshgacha., uz-cyrl: Маҳаллий ҳокимият тавсияси билан аҳолиси камаяётган ҳудудга кўчган F-4 эгаси; кўчиб келувчилар 60 ёшгача.}
