    how: {en: '3+ years on F-2-7, income of 2× GNI (1× if you came via E-7-S2) or assets of 1.5× average, KIIP level 5.', ru: '3+ года на F-2-7, доход 2× ВНД (1× при пути через E-7-S2) или активы 1,5× от среднего, KIIP 5.', uz: 'F-2-7 da 3+ yil, daromad 2× GNI (E-7-S2 orqali kelganlar uchun 1×) yoki aktivlar o‘rtachadan 1,5×, KIIP 5.', uz-cyrl: 'F-2-7 да 3+ йил, даромад 2× GNI (E-7-S2 орқали келганлар учун 1×) ёки активлар ўртачадан 1,5×, KIIP 5.'}
