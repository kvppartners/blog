      koreanChild: true
      spouse: [exKorean, none]
  F-6-3:
    name: {en: Marriage ended (not your fault), ru: Брак прекращён не по вашей вине, uz: Nikoh sizning aybingizsiz tugagan, uz-cyrl: Никоҳ сизнинг айбингизсиз тугаган}
    how: {en: 'The marriage ended through the Korean spouse''s death, disappearance or fault.', ru: 'Брак прекращён из-за смерти, исчезновения или вины супруга-гражданина Кореи.', uz: 'Nikoh Koreya fuqarosi bo‘lgan turmush o‘rtog‘ining vafoti, bedarak yo‘qolishi yoki aybi bilan tugagan.', uz-cyrl: 'Никоҳ Корея фуқароси бўлган турмуш ўртоғининг вафоти, бедарак йўқолиши ёки айби билан тугаган.'}
    next: [F-5-2]
