  E-7-S1:
    name: {en: High-income professional, ru: Специалист с высоким доходом, uz: Yuqori daromadli mutaxassis, uz-cyrl: Юқори даромадли мутахассис}
    how: {en: 'A job with income of at least 3× GNI, in any occupation except simple labour, jobs against public morals and other jobs closed to foreigners; no degree or experience requirement.', ru: 'Работа с доходом от 3× ВНД по любой профессии, кроме простого физического труда, работы, противоречащей общественной морали, и других профессий, закрытых для иностранцев; диплом и опыт не требуются.', uz: 'Kamida 3× GNI daromadli ish, oddiy jismoniy mehnat, jamoat axloqiga zid ishlar va chet elliklar uchun yopiq boshqa kasblardan tashqari istalgan kasbda; diplom va tajriba talab qilinmaydi.', uz-cyrl: 'Камида 3× GNI даромадли иш, оддий жисмоний меҳнат, жамоат ахлоқига зид ишлар ва чет элликлар учун ёпиқ бошқа касблардан ташқари исталган касбда; диплом ва тажриба талаб қилинмайди.'}
    work: true
