    how: {en: F-2-8 investment kept for 5 years., ru: Инвестиции F-2-8 сохраняются 5 лет., uz: F-2-8 investitsiyasi 5 yil saqlangan., uz-cyrl: F-2-8 инвестицияси 5 йил сақланган.}
  F-5-18:
    name: {en: Family of points-based PR, ru: Семья обладателя ПМЖ по баллам, uz: Ball tizimidagi doimiy yashovchi oilasi, uz-cyrl: Балл тизимидаги доимий яшовчи оиласи}
    how: {en: 2+ years on F-2-71 after the family member has held F-5-16 for 2+ years; income of 1× GNI; KIIP level 5., ru: '2+ года на F-2-71 после того, как член семьи 2+ года имеет F-5-16; доход 1× ВНД; KIIP 5.', uz: Oila a’zosi 2+ yil F-5-16 ga ega bo‘lgach F-2-71 da 2+ yil; daromad 1× GNI; KIIP 5., uz-cyrl: Оила аъзоси 2+ йил F-5-16 га эга бўлгач F-2-71 да 2+ йил; даромад 1× GNI; KIIP 5.}
    lang: {kiip: 5}
  F-5-19:
    name: {en: Family of tourism/resort investor, ru: Семья инвестора в туризм, uz: Turizm investori oilasi, uz-cyrl: Туризм инвестори оиласи}
    how: {en: Spouse or unmarried child of an F-5-17 holder after 5 years on F-2-8 or F-2-81., ru: 'Супруг(а) или ребёнок обладателя F-5-17, не состоящий в браке, после 5 лет на F-2-8 или F-2-81.', uz: F-2-8 yoki F-2-81 da 5 yildan keyin F-5-17 egasining turmush o‘rtog‘i yoki turmush qurmagan farzandi., uz-cyrl: F-2-8 ёки F-2-81 да 5 йилдан кейин F-5-17 эгасининг турмуш ўртоғи ёки турмуш қурмаган фарзанди.}
  F-5-21:
    name: {en: Public-interest investor, ru: Инвестор в общественные проекты, uz: Jamoat loyihalari investori, uz-cyrl: Жамоат лойиҳалари инвестори}
    how: {en: F-2-12 investment kept for 5 years., ru: Инвестиции F-2-12 сохраняются 5 лет., uz: F-2-12 investitsiyasi 5 yil saqlangan., uz-cyrl: F-2-12 инвестицияси 5 йил сақланган.}
  F-5-22:
    name: {en: Family of public-interest investor, ru: Семья инвестора в общественные проекты, uz: Jamoat loyihalari investori oilasi, uz-cyrl: Жамоат лойиҳалари инвестори оиласи}
    how: {en: Spouse or unmarried child of an F-5-21 holder., ru: 'Супруг(а) или ребёнок обладателя F-5-21, не состоящий в браке.', uz: F-5-21 egasining turmush o‘rtog‘i yoki turmush qurmagan farzandi., uz-cyrl: F-5-21 эгасининг турмуш ўртоғи ёки турмуш қурмаган фарзанди.}
  F-5-24:
    name: {en: Tech start-up founder, ru: Основатель техностартапа, uz: Texnologik startap asoschisi, uz-cyrl: Технологик стартап асосчиси}
    how: {en: '3+ years on D-8-4, ₩300M+ of investment raised and 2+ Korean full-time employees.', ru: '3+ года на D-8-4, привлечено от ₩300 млн инвестиций и 2+ корейских штатных сотрудника.', uz: 'D-8-4 da 3+ yil, ₩300 mln+ investitsiya jalb qilingan va 2+ koreys shtat xodimi.', uz-cyrl: 'D-8-4 да 3+ йил, ₩300 млн+ инвестиция жалб қилинган ва 2+ корейс штат ходими.'}
  F-5-25:
    name: {en: Conditional large investor, ru: Условный крупный инвестор, uz: Shartli yirik investor, uz-cyrl: Шартли йирик инвестор}
    how: {en: ₩3bn deposited in a designated public fund with a pledge to keep it for 5 years; withdrawing it cancels the status., ru: ₩3 млрд на счёте определённого общественного фонда с обязательством хранить 5 лет; при изъятии статус аннулируется., uz: 'Belgilangan jamoat fondiga ₩3 mlrd 5 yil saqlash majburiyati bilan; pul qaytarib olinsa, maqom bekor qilinadi.', uz-cyrl: 'Белгиланган жамоат фондига ₩3 млрд 5 йил сақлаш мажбурияти билан; пул қайтариб олинса, мақом бекор қилинади.'}
    needs: {invest: 6}
  F-5-26:
    name: {en: R&D staff at a foreign-invested firm, ru: Сотрудник R&D компании с иностранным капиталом, uz: Xorijiy investitsiyali kompaniyaning R&D xodimi, uz-cyrl: Хорижий инвестицияли компаниянинг R&D ходими}
    how: {en: 3+ years as essential R&D staff of a foreign-invested company (D-8-1); bachelor's degree; income of 2× GNI., ru: 3+ года ключевым сотрудником R&D компании с иностранными инвестициями (D-8-1); диплом бакалавра; доход 2× ВНД., uz: Xorijiy investitsiyali kompaniyada (D-8-1) asosiy R&D xodimi sifatida 3+ yil; bakalavr diplomi; daromad 2× GNI., uz-cyrl: Хорижий инвестицияли компанияда (D-8-1) асосий R&D ходими сифатида 3+ йил; бакалавр дипломи; даромад 2× GNI.}
  F-5-27:
    name: {en: Recognised refugee, ru: Признанный беженец, uz: Tan olingan qochqin, uz-cyrl: Тан олинган қочқин}
    how: {en: '2+ years as a recognised refugee (F-2-4), under a separate guideline with income and KIIP requirements.', ru: 2+ года в статусе признанного беженца (F-2-4) по отдельному регламенту с требованиями к доходу и KIIP., uz: 'Tan olingan qochqin (F-2-4) sifatida 2+ yil, daromad va KIIP talablari bo‘lgan alohida yo‘riqnoma asosida.', uz-cyrl: 'Тан олинган қочқин (F-2-4) сифатида 2+ йил, даромад ва KIIP талаблари бўлган алоҳида йўриқнома асосида.'}
  F-5-28:
    name: {en: Special contributor, ru: Особый вклад, uz: Alohida hissa qo‘shgan shaxs, uz-cyrl: Алоҳида ҳисса қўшган шахс}
    how: {en: 2+ years on F-2-16; income of 1× GNI or average assets; KIIP level 5., ru: 2+ года на F-2-16; доход 1× ВНД или средние активы; KIIP 5., uz: F-2-16 da 2+ yil; daromad 1× GNI yoki o‘rtacha aktivlar; KIIP 5., uz-cyrl: F-2-16 да 2+ йил; даромад 1× GNI ёки ўртача активлар; KIIP 5.}
    lang: {kiip: 5}
  F-5-29:
    name: {en: Family of special contributor, ru: Семья лица с особым вкладом, uz: Alohida hissa qo‘shgan shaxs oilasi, uz-cyrl: Алоҳида ҳисса қўшган шахс оиласи}
    how: {en: 'Spouse or minor child, 2+ years after the family member got F-5-28; income of 1× GNI.', ru: 'Супруг(а) или несовершеннолетний ребёнок, через 2+ года после получения членом семьи F-5-28; доход 1× ВНД.', uz: 'Turmush o‘rtog‘i yoki voyaga yetmagan farzand, oila a’zosi F-5-28 olganidan 2+ yil o‘tib; daromad 1× GNI.', uz-cyrl: 'Турмуш ўртоғи ёки вояга етмаган фарзанд, оила аъзоси F-5-28 олганидан 2+ йил ўтиб; даромад 1× GNI.'}
  F-5-S1:
    name: {en: K-STAR permanent residence, ru: ПМЖ K-STAR, uz: K-STAR doimiy yashash, uz-cyrl: K-STAR доимий яшаш}
    how: {en: 3+ years on F-2-7S or F-2-7 as a K-STAR graduate and 90/200 K-STAR points., ru: 3+ года на F-2-7S или F-2-7 как выпускник K-STAR и 90/200 баллов K-STAR., uz: K-STAR bitiruvchisi sifatida F-2-7S yoki F-2-7 da 3+ yil va 90/200 K-STAR ball., uz-cyrl: K-STAR битирувчиси сифатида F-2-7S ёки F-2-7 да 3+ йил ва 90/200 K-STAR балл.}
  F-5-S2:
    name: {en: K-STAR family, ru: Семья K-STAR, uz: K-STAR oilasi, uz-cyrl: K-STAR оиласи}
    how: {en: Spouse or minor child of an F-5-S1 holder after 2+ years on F-2-71., ru: Супруг(а) или несовершеннолетний ребёнок обладателя F-5-S1 после 2+ лет на F-2-71., uz: F-2-71 da 2+ yildan keyin F-5-S1 egasining turmush o‘rtog‘i yoki voyaga yetmagan farzandi., uz-cyrl: F-2-71 да 2+ йилдан кейин F-5-S1 эгасининг турмуш ўртоғи ёки вояга етмаган фарзанди.}
  F-5-T:
    name: {en: Top-Tier permanent residence, ru: ПМЖ Top-Tier, uz: Top-Tier doimiy yashash, uz-cyrl: Top-Tier доимий яшаш}
    how: {en: '3+ years on F-2-T in a high-tech or science field, income of 3× GNI, KIIP level 3 or TOPIK 3.', ru: '3+ года на F-2-T в hi-tech или науке, доход 3× ВНД, KIIP 3 или TOPIK 3.', uz: 'Yuqori texnologiyalar yoki fan sohasida F-2-T da 3+ yil, daromad 3× GNI, KIIP 3 yoki TOPIK 3.', uz-cyrl: 'Юқори технологиялар ёки фан соҳасида F-2-T да 3+ йил, даромад 3× GNI, KIIP 3 ёки TOPIK 3.'}
    lang: {topik: 3, kiip: 3}
  F-5-T1:
    name: {en: Top-Tier family, ru: Семья Top-Tier, uz: Top-Tier oilasi, uz-cyrl: Top-Tier оиласи}
    how: {en: 'Spouse or minor child: 3 years on F-2-T1 (2 years if joining after the family member got F-5-T).', ru: 'Супруг(а) или несовершеннолетний ребёнок: 3 года на F-2-T1 (2 года, если присоединились после получения F-5-T).', uz: 'Turmush o‘rtog‘i yoki voyaga yetmagan farzand: F-2-T1 da 3 yil (oila a’zosi F-5-T olgandan keyin qo‘shilsa, 2 yil).', uz-cyrl: 'Турмуш ўртоғи ёки вояга етмаган фарзанд: F-2-T1 да 3 йил (оила аъзоси F-5-T олгандан кейин қўшилса, 2 йил).'}
  NONE:
