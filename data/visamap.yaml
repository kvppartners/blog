    how: {en: 2+ years on F-2-2 while still a minor; no income test., ru: '2+ года на F-2-2, пока ребёнок несовершеннолетний; без требования к доходу.', uz: Voyaga yetmagan holda F-2-2 da 2+ yil; daromad talab qilinmaydi., uz-cyrl: Вояга етмаган ҳолда F-2-2 да 2+ йил; даромад талаб қилинмайди.}
