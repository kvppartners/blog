      note: {en: 'After 5+ years in work or business statuses (D-7–E-7, F-2), with the income and KIIP 5 requirements.', ru: 'После 5+ лет в рабочих или бизнес-статусах (D-7–E-7, F-2), при выполнении требований к доходу и KIIP 5.', uz: 'Ish yoki biznes maqomlarida (D-7–E-7, F-2) 5+ yildan keyin, daromad va KIIP 5 talablari bilan.', uz-cyrl: 'Иш ёки бизнес мақомларида (D-7–E-7, F-2) 5+ йилдан кейин, даромад ва KIIP 5 талаблари билан.'}
