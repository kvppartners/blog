      note: {en: 'Ethnic Korean of any nationality: former Korean citizen or descendant. Change of status in Korea if your proof of Korean descent is issued in Korea or can be checked in the immigration system; otherwise apply at a Korean consulate. You are then free to change employers. Men who gave up Korean nationality without military service: only from the year they turn 41.', ru: 'Этнический кореец любого гражданства: бывший гражданин Кореи или потомок. Смена статуса в Корее, если документы о корейском происхождении выданы в Корее или проверяются в иммиграционной системе; иначе — подача в консульстве Кореи. После этого можно свободно менять работодателя. Мужчины, отказавшиеся от гражданства Кореи без военной службы, — только с года, когда им исполнится 41.', uz: 'Har qanday fuqarolikdagi etnik koreys: Koreyaning sobiq fuqarosi yoki avlodi. Koreyalik kelib chiqishingizni tasdiqlovchi hujjatlar Koreyada berilgan yoki immigratsiya tizimida tekshirilsa, maqom Koreyada o‘zgartiriladi; aks holda Koreya konsulligiga topshiriladi. Shundan keyin ish beruvchini erkin almashtirish mumkin. Harbiy xizmatsiz Koreya fuqaroligidan chiqqan erkaklar — faqat 41 yoshga to‘ladigan yildan.', uz-cyrl: 'Ҳар қандай фуқароликдаги этник корейс: Кореянинг собиқ фуқароси ёки авлоди. Кореялик келиб чиқишингизни тасдиқловчи ҳужжатлар Кореяда берилган ёки иммиграция тизимида текширилса, мақом Кореяда ўзгартирилади; акс ҳолда Корея консуллигига топширилади. Шундан кейин иш берувчини эркин алмаштириш мумкин. Ҳарбий хизматсиз Корея фуқаролигидан чиққан эркаклар — фақат 41 ёшга тўладиган йилдан.'}
