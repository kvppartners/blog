    how: {en: Foreign doctorate in a high-tech field and 1+ year full-time at a Korean company; income of 1× GNI., ru: Иностранная докторская степень в высокотехнологичной области и 1+ год работы в корейской компании; доход 1× ВНД., uz: Yuqori texnologiyalar sohasida xorijiy doktorlik va Koreya kompaniyasida 1+ yil to‘liq ish; daromad 1× GNI., uz-cyrl: Юқори технологиялар соҳасида хорижий докторлик ва Корея компаниясида 1+ йил тўлиқ иш; даромад 1× GNI.}
