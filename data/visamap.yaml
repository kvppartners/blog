    - to: F-2-T
      note: {en: "With the Top-Tier degree and career (a master's or doctorate from a world top-100 university and 8+ years' career, or 5+ years of post-doctoral research) and 1+ year in a high-tech field in Korea: an income of 2× GNI (instead of 3×) and a ministry recommendation are enough.", ru: При образовании и опыте уровня Top-Tier (магистратура или докторантура вуза мирового топ-100 и 8+ лет опыта или 5+ лет постдокторских исследований) и после 1+ года работы в высокотехнологичной сфере в Корее достаточно дохода от 2× ВНД (вместо 3×) и рекомендации министерства., uz: 'Top-Tier darajasidagi ta’lim va tajriba (dunyo top-100 universitetida magistr yoki doktorlik va 8+ yil tajriba yoki 5+ yil doktorlikdan keyingi tadqiqot) bilan Koreyada yuqori texnologiyalar sohasida 1+ yildan keyin: kamida 2× GNI daromad (3× o‘rniga) va vazirlik tavsiyasi yetarli.', uz-cyrl: 'Top-Tier даражасидаги таълим ва тажриба (дунё top-100 университетида магистр ёки докторлик ва 8+ йил тажриба ёки 5+ йил докторликдан кейинги тадқиқот) билан Кореяда юқори технологиялар соҳасида 1+ йилдан кейин: камида 2× GNI даромад (3× ўрнига) ва вазирлик тавсияси етарли.'}
