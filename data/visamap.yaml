    how: {en: 'Work in a high-tech industry, even outside the listed E-7 occupations; 60+ points.', ru: 'Работа в высокотехнологичной отрасли, даже вне списка профессий E-7; 60+ баллов.', uz: 'Yuqori texnologiyalar sohasida ish, hatto E-7 ro‘yxatidan tashqarida ham; 60+ ball.', uz-cyrl: 'Юқори технологиялар соҳасида иш, ҳатто E-7 рўйхатидан ташқарида ҳам; 60+ балл.'}
