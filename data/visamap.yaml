    how: {en: 'Refugee status refused, but a humanitarian stay was granted.', ru: 'В статусе беженца отказано, но разрешено гуманитарное пребывание.', uz: 'Qochqin maqomi rad etilgan, ammo insonparvarlik asosida qolishga ruxsat berilgan.', uz-cyrl: 'Қочқин мақоми рад этилган, аммо инсонпарварлик асосида қолишга рухсат берилган.'}
