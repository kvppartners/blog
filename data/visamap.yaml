  F-4:
    name: {en: Overseas Korean, ru: Этнический кореец, uz: Xorijdagi koreys, uz-cyrl: Хориждаги корейс}
    how: {en: 'Ethnic Korean of any nationality: former Korean citizen or descendant. Men who gave up Korean nationality without military service: only from the year they turn 41.', ru: 'Этнический кореец любого гражданства: бывший гражданин Кореи или потомок. Мужчины, отказавшиеся от гражданства Кореи без военной службы, — только с года, когда им исполнится 41.', uz: 'Har qanday fuqarolikdagi etnik koreys: Koreyaning sobiq fuqarosi yoki avlodi. Harbiy xizmatsiz Koreya fuqaroligidan chiqqan erkaklar — faqat 41 yoshga to‘ladigan yildan.', uz-cyrl: 'Ҳар қандай фуқароликдаги этник корейс: Кореянинг собиқ фуқароси ёки авлоди. Ҳарбий хизматсиз Корея фуқаролигидан чиққан эркаклар — фақат 41 ёшга тўладиган йилдан.'}
