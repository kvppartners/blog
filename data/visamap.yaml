      note: {en: "If you are selected for a GKS scholarship, or for a full-tuition foreign-government or university STEM scholarship, while you study in Korea, you can change to D-2-7 here. Other than GKS: only after a set number of semesters and with the university president's recommendation.", ru: 'Если во время учёбы в Корее вас отобрали на стипендию GKS либо на стипендию иностранного правительства или университета (STEM) с полной оплатой обучения, статус можно сменить в Корее. Кроме GKS: только после определённого числа семестров и по рекомендации ректора.', uz: 'Koreyada o‘qiyotganingizda GKS stipendiyasiga yoki xorijiy hukumat yoxud universitetning (STEM) o‘qish to‘lovini to‘liq qoplaydigan stipendiyasiga tanlansangiz, maqomni Koreyada o‘zgartirish mumkin. GKS bo‘lmasa: faqat belgilangan miqdordagi semestrdan keyin va rektor tavsiyasi bilan.', uz-cyrl: 'Кореяда ўқиётганингизда GKS стипендиясига ёки хорижий ҳукумат ёхуд университетнинг (STEM) ўқиш тўловини тўлиқ қоплайдиган стипендиясига танлансангиз, мақомни Кореяда ўзгартириш мумкин. GKS бўлмаса: фақат белгиланган миқдордаги семестрдан кейин ва ректор тавсияси билан.'}
    - to: D-4-1
      note: {en: Korean-language course at a university language institute. Only if you leave your degree program (leave of absence or withdrawal) and enrol in a separate language course; language study within your own degree program needs no change of status., ru: Курс корейского языка при языковом институте университета. Только если вы прерываете учёбу по своей программе (академический отпуск или отчисление по собственному желанию) и записываетесь на отдельный языковой курс; изучение языка в рамках своей программы не требует смены статуса., uz: 'Universitet qoshidagi til markazida koreys tili kursi. Faqat o‘z dasturingizdagi o‘qishni to‘xtatib (akademik ta’til yoki o‘qishdan chiqish), alohida til kursiga yozilsangiz; o‘z dasturingiz doirasida til o‘rganish uchun maqomni o‘zgartirish shart emas.', uz-cyrl: 'Университет қошидаги тил марказида корейс тили курси. Фақат ўз дастурингиздаги ўқишни тўхтатиб (академик таътил ёки ўқишдан чиқиш), алоҳида тил курсига ёзилсангиз; ўз дастурингиз доирасида тил ўрганиш учун мақомни ўзгартириш шарт эмас.'}
    - to: D-10-1
      note: {en: 'After graduating from a Korean college or university: the first year is points-exempt; extensions go by points, up to 3 years in total.', ru: 'После окончания корейского колледжа или вуза: первый год — без балльной оценки; продление по баллам, всего до 3 лет.', uz: 'Koreya kolleji yoki universitetini tamomlagach: birinchi yil ball talab qilinmaydi; uzaytirish ball bo‘yicha, jami 3 yilgacha.', uz-cyrl: 'Корея коллежи ёки университетини тамомлагач: биринчи йил балл талаб қилинмайди; узайтириш балл бўйича, жами 3 йилгача.'}
      again: {en: 'You held D-10 before: points now apply (60+; waived with a Korean degree from the last 3 years and TOPIK 4 or KIIP 4). D-10 time adds up while you stay in Korea (up to 3 years); if it''s used up, apply for a new D-10 visa from abroad, which restarts the count.', ru: 'У вас уже был D-10: теперь нужны баллы (60+; не нужны при корейском дипломе за последние 3 года и TOPIK 4 или KIIP 4). Время на D-10 суммируется, пока вы в Корее (до 3 лет); если оно исчерпано, оформите новую визу D-10 из-за рубежа — отсчёт начнётся заново.', uz: 'Sizda avval D-10 bo‘lgan: endi ball kerak (60+; so‘nggi 3 yildagi Koreya diplomi va TOPIK 4 yoki KIIP 4 bilan kerak emas). D-10 dagi vaqt Koreyada bo‘lganingizda jamlanadi (3 yilgacha); u tugagan bo‘lsa, chet eldan yangi D-10 vizasini oling — hisob qaytadan boshlanadi.', uz-cyrl: 'Сизда аввал D-10 бўлган: энди балл керак (60+; сўнгги 3 йилдаги Корея дипломи ва TOPIK 4 ёки KIIP 4 билан керак эмас). D-10 даги вақт Кореяда бўлганингизда жамланади (3 йилгача); у тугаган бўлса, чет элдан янги D-10 визасини олинг — ҳисоб қайтадан бошланади.'}
