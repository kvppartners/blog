  E-7-Y:
    name: {en: Korea-raised youth worker, ru: 'Работающая молодёжь, выросшая в Корее', uz: Koreyada ulg‘aygan yosh ishchi, uz-cyrl: Кореяда улғайган ёш ишчи}
    how: {en: 'Aged 18–24, grew up in Korea and finished Korean school, now starting a job.', ru: 'Возраст 18–24, вырос(ла) в Корее и окончил(а) корейскую школу, начинает работать.', uz: 'Yosh 18–24, Koreyada ulg‘aygan va Koreya maktabini tamomlagan, ish boshlayotgan.', uz-cyrl: 'Ёш 18–24, Кореяда улғайган ва Корея мактабини тамомлаган, иш бошлаётган.'}
    work: true
    next:
    - to: F-2-R
      note: {en: 'Youth raised in Korea have their own F-2-R track, whose conditions may differ from the general regional-talent rules. Once on it, extensions check only that you still live in the area. Ask immigration (1345) for the current conditions.', ru: 'Для молодёжи, выросшей в Корее, есть отдельный трек F-2-R; его условия могут отличаться от общих правил для региональных специалистов. После получения статуса при продлении проверяется только то, что вы по-прежнему живёте в этом районе. Актуальные условия уточните в иммиграционной службе (1345).', uz: 'Koreyada ulg‘aygan yoshlar uchun alohida F-2-R yo‘nalishi bor; uning shartlari hududiy mutaxassislar uchun umumiy qoidalardan farq qilishi mumkin. Maqomni olgach, uzaytirishda faqat hali ham shu hududda yashayotganingiz tekshiriladi. Amaldagi shartlarni immigratsiya xizmatidan aniqlang (1345).', uz-cyrl: 'Кореяда улғайган ёшлар учун алоҳида F-2-R йўналиши бор; унинг шартлари ҳудудий мутахассислар учун умумий қоидалардан фарқ қилиши мумкин. Мақомни олгач, узайтиришда фақат ҳали ҳам шу ҳудудда яшаётганингиз текширилади. Амалдаги шартларни иммиграция хизматидан аниқланг (1345).'}
