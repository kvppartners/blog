  E-2:
    name: {en: Language instructor, ru: Преподаватель языка, uz: Til o‘qituvchisi, uz-cyrl: Тил ўқитувчиси}
    how: {en: "Native-speaker conversation teacher at an institute, school or public program (EPIK, TaLK). English teachers: citizens of the US, UK, Canada, South Africa, New Zealand, Australia or Ireland. Other languages: only the language of your own country. You need a degree from that country, or high school or college there plus a Korean bachelor's.", ru: 'Преподаватель-носитель языка в школе, институте или госпрограмме (EPIK, TaLK). Английский: граждане США, Великобритании, Канады, ЮАР, Новой Зеландии, Австралии или Ирландии. Другие языки: только язык своей страны. Нужен диплом вуза этой страны либо школа или колледж там и корейский бакалавриат.', uz: 'Til markazi, maktab yoki davlat dasturida (EPIK, TaLK) ona tili sohibi o‘qituvchi. Ingliz tili: AQSh, Buyuk Britaniya, Kanada, JAR, Yangi Zelandiya, Avstraliya yoki Irlandiya fuqarolari. Boshqa tillar: faqat o‘z davlatingiz tili. Shu davlat universiteti diplomi yoki u yerdagi maktab yoxud kollej va Koreya bakalavri kerak.', uz-cyrl: 'Тил маркази, мактаб ёки давлат дастурида (EPIK, TaLK) она тили соҳиби ўқитувчи. Инглиз тили: АҚШ, Буюк Британия, Канада, ЖАР, Янги Зеландия, Австралия ёки Ирландия фуқаролари. Бошқа тиллар: фақат ўз давлатингиз тили. Шу давлат университети дипломи ёки у ердаги мактаб ёхуд коллеж ва Корея бакалаври керак.'}
    work: true
    countries: e2
    notes:
    - countries: [IN]
      text: {en: "Indian citizens: English teaching only under the Korea–India CEPA, with a bachelor's degree and an English-teacher certificate.", ru: 'Граждане Индии: только преподавание английского по соглашению CEPA между Кореей и Индией, с дипломом бакалавра и сертификатом учителя английского.', uz: 'Hindiston fuqarolari: faqat Koreya–Hindiston CEPA kelishuvi bo‘yicha ingliz tili o‘qitish, bakalavr diplomi va ingliz tili o‘qituvchisi sertifikati bilan.', uz-cyrl: 'Ҳиндистон фуқаролари: фақат Корея–Ҳиндистон CEPA келишуви бўйича инглиз тили ўқитиш, бакалавр дипломи ва инглиз тили ўқитувчиси сертификати билан.'}
    - countries: [CN, TW, HK, JP, RU, FR, DE, ES, VN, MN, TH, ID]
      text: {en: "Only to teach your own country's native language, with a bachelor's degree from a university in that country (or a high school there plus a Korean bachelor's).", ru: 'Только для преподавания родного языка вашей страны, с дипломом бакалавра вуза этой страны (или после старшей школы там и корейского бакалавриата).', uz: 'Faqat o‘z mamlakatingiz ona tilini o‘qitish uchun, shu mamlakat universitetining bakalavr diplomi bilan (yoki u yerda o‘rta maktab va Koreyada bakalavr).', uz-cyrl: 'Фақат ўз мамлакатингиз она тилини ўқитиш учун, шу мамлакат университетининг бакалавр дипломи билан (ёки у ерда ўрта мактаб ва Кореяда бакалавр).'}
    next:
    - E-7-1
    - to: F-4
      note: {en: 'Ethnic Korean of any nationality: former Korean citizen or descendant. Change of status in Korea if your proof of Korean descent is issued in Korea or can be checked in the immigration system; otherwise apply at a Korean consulate. You are then free to change employers. Men who gave up Korean nationality without military service: only from the year they turn 41.', ru: 'Этнический кореец любого гражданства: бывший гражданин Кореи или потомок. Смена статуса в Корее, если документы о корейском происхождении выданы в Корее или проверяются в иммиграционной системе; иначе — подача в консульстве Кореи. После этого можно свободно менять работодателя. Мужчины, отказавшиеся от гражданства Кореи без военной службы, — только с года, когда им исполнится 41.', uz: 'Har qanday fuqarolikdagi etnik koreys: Koreyaning sobiq fuqarosi yoki avlodi. Koreyalik kelib chiqishingizni tasdiqlovchi hujjatlar Koreyada berilgan yoki immigratsiya tizimida tekshirilsa, maqom Koreyada o‘zgartiriladi; aks holda Koreya konsulligiga topshiriladi. Shundan keyin ish beruvchini erkin almashtirish mumkin. Harbiy xizmatsiz Koreya fuqaroligidan chiqqan erkaklar — faqat 41 yoshga to‘ladigan yildan.', uz-cyrl: 'Ҳар қандай фуқароликдаги этник корейс: Кореянинг собиқ фуқароси ёки авлоди. Кореялик келиб чиқишингизни тасдиқловчи ҳужжатлар Кореяда берилган ёки иммиграция тизимида текширилса, мақом Кореяда ўзгартирилади; акс ҳолда Корея консуллигига топширилади. Шундан кейин иш берувчини эркин алмаштириш мумкин. Ҳарбий хизматсиз Корея фуқаролигидан чиққан эркаклар — фақат 41 ёшга тўладиган йилдан.'}
