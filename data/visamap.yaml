    name: {en: Research student, ru: Стажёр-исследователь, uz: Tadqiqotchi talaba, uz-cyrl: Тадқиқотчи талаба}
    how: {en: Non-degree research at a Korean university. Master's degree or higher in principle; a STEM student still enrolled in a bachelor's programme abroad qualifies only when invited by a Korean university in the QS top 500 or THE top 200., ru: 'Исследовательская стажировка в корейском вузе без получения степени. В принципе нужна степень магистра или выше; студент STEM, ещё обучающийся в бакалавриате за рубежом, подходит, только если его приглашает корейский вуз из топ-500 QS или топ-200 THE.', uz: Koreya universitetida daraja berilmaydigan tadqiqot. Qoida tariqasida magistr yoki undan yuqori daraja kerak; chet elda hali bakalavriatda o‘qiyotgan STEM talabasi faqat QS top-500 yoki THE top-200 dagi Koreya universiteti taklif qilsa mos keladi., uz-cyrl: Корея университетида даража берилмайдиган тадқиқот. Қоида тариқасида магистр ёки ундан юқори даража керак; чет элда ҳали бакалавриатда ўқиётган STEM талабаси фақат QS top-500 ёки THE top-200 даги Корея университети таклиф қилса мос келади.}
