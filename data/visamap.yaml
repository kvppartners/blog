      note: {en: 'Local-government recommendation, a Korean associate degree or regional-wage income, KIIP 3 or TOPIK 3. You must live in the recommending area and commit to living and working (or running a business) in a depopulating area for 5 years after approval: the first 2 years in the recommended area itself, then you may move to another depopulating area in the same province. Not possible if your visa before D-10 was D-3, D-4, E-6-2, E-8, E-9, E-10, G-1 or H-1.', ru: 'Рекомендация местных властей, корейский диплом колледжа или доход на уровне региона, KIIP 3 или TOPIK 3. Необходимо проживать в рекомендующем районе и обязаться жить и работать (или вести бизнес) в депопулирующем районе 5 лет после одобрения: первые 2 года — в самом рекомендованном районе, затем можно переехать в другой депопулирующий район той же провинции. Невозможно, если до D-10 у вас была виза D-3, D-4, E-6-2, E-8, E-9, E-10, G-1 или H-1.', uz: 'Mahalliy hokimiyat tavsiyasi, Koreya kolleji diplomi yoki hududiy darajadagi daromad, KIIP 3 yoki TOPIK 3. Tavsiya bergan hududda yashashingiz va tasdiqlangandan keyin 5 yil aholisi kamayayotgan hududda yashash va ishlash (yoki biznes yuritish) majburiyatini olishingiz kerak: dastlabki 2 yil aynan tavsiya etilgan hududda, keyin shu viloyatdagi boshqa aholisi kamayayotgan hududga ko‘chish mumkin. D-10 dan oldin D-3, D-4, E-6-2, E-8, E-9, E-10, G-1 yoki H-1 vizasi bo‘lgan bo‘lsa, mumkin emas.', uz-cyrl: 'Маҳаллий ҳокимият тавсияси, Корея коллежи дипломи ёки ҳудудий даражадаги даромад, KIIP 3 ёки TOPIK 3. Тавсия берган ҳудудда яшашингиз ва тасдиқлангандан кейин 5 йил аҳолиси камаяётган ҳудудда яшаш ва ишлаш (ёки бизнес юритиш) мажбуриятини олишингиз керак: дастлабки 2 йил айнан тавсия этилган ҳудудда, кейин шу вилоятдаги бошқа аҳолиси камаяётган ҳудудга кўчиш мумкин. D-10 дан олдин D-3, D-4, E-6-2, E-8, E-9, E-10, G-1 ёки H-1 визаси бўлган бўлса, мумкин эмас.'}
