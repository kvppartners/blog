      note: {en: 'After 1+ year of work: points waived, KIIP level 3 needed.', ru: 'После 1+ года работы: без балльной оценки, нужен KIIP 3.', uz: '1+ yil ishlagandan keyin: ball talab qilinmaydi, KIIP 3 kerak.', uz-cyrl: '1+ йил ишлагандан кейин: балл талаб қилинмайди, KIIP 3 керак.'}
