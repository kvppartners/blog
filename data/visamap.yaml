      note: {en: Korean graduates are exempt from the work-experience rule; salary floor applies., ru: Выпускники корейских вузов освобождены от требования об опыте работы; действует минимальная зарплата., uz: Koreya bitiruvchilari ish tajribasi talabidan ozod; eng kam ish haqi talabi amal qiladi., uz-cyrl: Корея битирувчилари иш тажрибаси талабидан озод; энг кам иш ҳақи талаби амал қилади.}
