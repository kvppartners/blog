    how: {en: 'Paid work of up to 90 days, such as lectures, performances or technical guidance.', ru: 'Оплачиваемая работа до 90 дней: лекции, выступления, техническое консультирование.', uz: '90 kungacha haq to‘lanadigan ish: ma’ruzalar, chiqishlar, texnik maslahat.', uz-cyrl: '90 кунгача ҳақ тўланадиган иш: маърузалар, чиқишлар, техник маслаҳат.'}
