      note: {en: "After graduating, this is a new admission, so the lower-level rule for students doesn't apply. Before graduating, moving down is an exception: only some majors (such as STEM), TOPIK 3+, and finishing within your current program's time limit.", ru: 'После окончания это новое поступление, и правило о переходе на уровень ниже не действует. До окончания переход ниже — исключение: только некоторые специальности (например, STEM), TOPIK 3+ и окончание в пределах срока текущей программы.', uz: 'O‘qishni tamomlagach bu yangi qabul hisoblanadi, shuning uchun pastroq darajaga o‘tish qoidasi qo‘llanmaydi. Tamomlashdan oldin pastga o‘tish — istisno: faqat ayrim mutaxassisliklar (masalan, STEM), TOPIK 3+ va joriy dastur muddati ichida tamomlash sharti bilan.', uz-cyrl: 'Ўқишни тамомлагач бу янги қабул ҳисобланади, шунинг учун пастроқ даражага ўтиш қоидаси қўлланмайди. Тамомлашдан олдин пастга ўтиш — истисно: фақат айрим мутахассисликлар (масалан, STEM), TOPIK 3+ ва жорий дастур муддати ичида тамомлаш шарти билан.'}
