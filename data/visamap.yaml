    how: {en: '2+ years on F-4 plus income of 1× GNI or another option (assets, trade, investment, pension at 60+); KIIP not required.', ru: '2+ года на F-4 и доход 1× ВНД или другой вариант (активы, торговля, инвестиции, пенсия с 60 лет); KIIP не нужен.', uz: 'F-4 da 2+ yil va 1× GNI daromad yoki boshqa variant (aktivlar, savdo, investitsiya, 60 yoshdan pensiya); KIIP talab qilinmaydi.', uz-cyrl: 'F-4 да 2+ йил ва 1× GNI даромад ёки бошқа вариант (активлар, савдо, инвестиция, 60 ёшдан пенсия); KIIP талаб қилинмайди.'}
