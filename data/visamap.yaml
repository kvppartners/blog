    - to: D-2-4
      abroadFor: notified
      note: {en: In Korea only for citizens of some countries and if the course starts before your stay ends; otherwise apply from abroad., ru: В Корее — только для граждан некоторых стран и если учёба начинается до окончания пребывания; иначе — подача из-за рубежа., uz: Koreyada faqat ayrim davlatlar fuqarolari uchun va o‘qish qolish muddati tugashidan oldin boshlansa; aks holda chet eldan topshiriladi., uz-cyrl: Кореяда фақат айрим давлатлар фуқаролари учун ва ўқиш қолиш муддати тугашидан олдин бошланса; акс ҳолда чет элдан топширилади.}
    - to: D-10-1
      note: {en: 'Bachelor''s degree and 60+ points (80+ for citizens of the 21 notified countries, including Uzbekistan); 1 year in total, 3 years with 80+ points.', ru: 'Диплом бакалавра и 60+ баллов (80+ для граждан 21 страны из особого списка, включая Узбекистан); всего 1 год, при 80+ баллах — 3 года.', uz: 'Bakalavr diplomi va 60+ ball (maxsus ro‘yxatdagi 21 davlat, jumladan O‘zbekiston fuqarolari uchun 80+); jami 1 yil, 80+ ball bilan 3 yil.', uz-cyrl: 'Бакалавр дипломи ва 60+ балл (махсус рўйхатдаги 21 давлат, жумладан Ўзбекистон фуқаролари учун 80+); жами 1 йил, 80+ балл билан 3 йил.'}
    - to: E-7-1
      note: {en: 'Job offer in one of about 67 professional occupations, usually with a related degree; salary of at least ₩31.1M (2026). From a short-term stay this is normally a new visa from abroad. In Korea only if you are hired as a teacher at a foreign school, are a high-tech specialist (IT, e-business, BT, NT, new materials, transport machinery, digital electronics, environment/energy) with a recommendation from the competent ministry, or work at a Jeju international school (graduate of its overseas home school, 18+, with 2+ years of experience or a TESOL-type certificate).', ru: 'Предложение работы по одной из ~67 профессий, обычно с профильным дипломом; зарплата от ₩31,1 млн (2026). Из краткосрочного статуса это обычно новая виза из-за рубежа. В Корее — только если вас нанимают учителем в иностранную школу, вы специалист высокотехнологичной отрасли (ИТ, электронная коммерция, BT, NT, новые материалы, транспортное машиностроение, цифровая электроника, экология и энергетика) с рекомендацией профильного министерства или работаете в международной школе на Чеджу (выпускник её зарубежной головной школы, 18+, с опытом от 2 лет или сертификатом типа TESOL).', uz: 'Taxminan 67 ta kasbdan biri bo‘yicha ish taklifi, odatda tegishli diplom bilan; ish haqi kamida ₩31,1 mln (2026). Qisqa muddatli maqomdan bu odatda chet eldan yangi viza. Koreyada faqat xorijiy maktabga o‘qituvchi sifatida ishga olinsangiz, tegishli vazirlik tavsiyasi bilan yuqori texnologiyali soha (IT, elektron tijorat, BT, NT, yangi materiallar, transport mashinasozligi, raqamli elektronika, ekologiya va energetika) mutaxassisi bo‘lsangiz yoki Chejudagi xalqaro maktabda ishlasangiz (uning xorijdagi bosh maktabini bitirgan, 18+, 2+ yillik tajriba yoki TESOL turidagi sertifikat bilan).', uz-cyrl: 'Тахминан 67 та касбдан бири бўйича иш таклифи, одатда тегишли диплом билан; иш ҳақи камида ₩31,1 млн (2026). Қисқа муддатли мақомдан бу одатда чет элдан янги виза. Кореяда фақат хорижий мактабга ўқитувчи сифатида ишга олинсангиз, тегишли вазирлик тавсияси билан юқори технологияли соҳа (IT, электрон тижорат, BT, NT, янги материаллар, транспорт машинасозлиги, рақамли электроника, экология ва энергетика) мутахассиси бўлсангиз ёки Чежудаги халқаро мактабда ишласангиз (унинг хориждаги бош мактабини битирган, 18+, 2+ йиллик тажриба ёки TESOL туридаги сертификат билан).'}
      abroadFor: b1NoChange
    - to: E-2
      abroadFor: b1NoChange
      note: {en: 'Native-speaker conversation teacher at an institute, school or public program (EPIK, TaLK). English teachers: citizens of the US, UK, Canada, South Africa, New Zealand, Australia or Ireland. Usually a new visa from abroad, but school teachers hired by the Ministry of Education or a provincial office of education (EPIK, TaLK) can change status in Korea.', ru: 'Преподаватель-носитель языка в школе, институте или госпрограмме (EPIK, TaLK). Английский: граждане США, Великобритании, Канады, ЮАР, Новой Зеландии, Австралии или Ирландии. Обычно нужна новая виза из-за рубежа, но школьные учителя, которых нанимает Министерство образования или региональное управление образования (EPIK, TaLK), могут сменить статус в Корее.', uz: 'Til markazi, maktab yoki davlat dasturida (EPIK, TaLK) ona tili sohibi o‘qituvchi. Ingliz tili: AQSh, Buyuk Britaniya, Kanada, JAR, Yangi Zelandiya, Avstraliya yoki Irlandiya fuqarolari. Odatda chet eldan yangi viza kerak, ammo Ta’lim vazirligi yoki viloyat ta’lim boshqarmasi maktabga ishga olgan o‘qituvchilar (EPIK, TaLK) Koreyada maqomni o‘zgartirishi mumkin.', uz-cyrl: 'Тил маркази, мактаб ёки давлат дастурида (EPIK, TaLK) она тили соҳиби ўқитувчи. Инглиз тили: АҚШ, Буюк Британия, Канада, ЖАР, Янги Зеландия, Австралия ёки Ирландия фуқаролари. Одатда чет элдан янги виза керак, аммо Таълим вазирлиги ёки вилоят таълим бошқармаси мактабга ишга олган ўқитувчилар (EPIK, TaLK) Кореяда мақомни ўзгартириши мумкин.'}
    - {to: E-9, abroad: true}
