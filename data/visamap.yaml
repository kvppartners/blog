      note: {en: In Korea only for citizens of some countries and if the course starts before your stay ends; otherwise apply from abroad., ru: В Корее — только для граждан некоторых стран и если учёба начинается до окончания пребывания; иначе — подача из-за рубежа., uz: Koreyada faqat ayrim davlatlar fuqarolari uchun va o‘qish qolish muddati tugashidan oldin boshlansa; aks holda chet eldan topshiriladi., uz-cyrl: Кореяда фақат айрим давлатлар фуқаролари учун ва ўқиш қолиш муддати тугашидан олдин бошланса; акс ҳолда чет элдан топширилади.}
