    how: {en: '4+ years on H-2 with the same employer in manufacturing, farming, fishing or care work, plus a qualification or income of 70% of GNI.', ru: '4+ года на H-2 у одного работодателя в производстве, сельском хозяйстве, рыболовстве или уходе, плюс квалификация или доход 70% ВНД.', uz: 'Ishlab chiqarish, qishloq xo‘jaligi, baliqchilik yoki parvarish sohasida bitta ish beruvchida H-2 da 4+ yil, malaka yoki GNI ning 70% daromadi bilan.', uz-cyrl: 'Ишлаб чиқариш, қишлоқ хўжалиги, балиқчилик ёки парвариш соҳасида битта иш берувчида H-2 да 4+ йил, малака ёки GNI нинг 70% даромади билан.'}
