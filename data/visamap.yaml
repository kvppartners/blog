    needs: {spouse: korean}
    lang: {topik: 1, kiip: 2}
    notes:
    - countries: marriageProgram
      text: {en: 'For your nationality, the Korean spouse must first complete the international marriage guidance programme.', ru: Для вашего гражданства супруг-кореец сначала должен пройти программу по международным бракам., uz: Fuqaroligingiz uchun koreyalik turmush o‘rtog‘ingiz avval xalqaro nikoh bo‘yicha tushuntirish dasturidan o‘tishi kerak., uz-cyrl: Фуқаролигингиз учун кореялик турмуш ўртоғингиз аввал халқаро никоҳ бўйича тушунтириш дастуридан ўтиши керак.}
  F-6-2:
    name: {en: Parent raising a Korean child, ru: 'Родитель, воспитывающий ребёнка', uz: Koreys farzandini tarbiyalayotgan ota-ona, uz-cyrl: Корейс фарзандини тарбиялаётган ота-она}
    how: {en: 'After the marriage to a Korean citizen ended, raising your minor Korean child in Korea. While still married, you stay on F-6-1.', ru: 'После окончания брака с гражданином Кореи — воспитание в Корее вашего несовершеннолетнего ребёнка-корейца. Пока брак продолжается, вы остаётесь на F-6-1.', uz: 'Koreya fuqarosi bilan nikoh tugaganidan keyin Koreyada voyaga yetmagan koreys farzandingizni tarbiyalash. Nikoh davom etsa, F-6-1 da qolasiz.', uz-cyrl: 'Корея фуқароси билан никоҳ тугаганидан кейин Кореяда вояга етмаган корейс фарзандингизни тарбиялаш. Никоҳ давом этса, F-6-1 да қоласиз.'}
    next: [F-5-2]
