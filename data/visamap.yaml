      text: {en: 'For Uzbek citizens (Korean Embassy in Tashkent, 2026): TOPIK 2 and USD 15,500 (Seoul area) or 12,500 (elsewhere) in a KDB account for 1+ month.', ru: 'Для граждан Узбекистана (посольство Кореи в Ташкенте, 2026): TOPIK 2 и 15 500 USD (столичный регион) или 12 500 USD (другие регионы) на счёте KDB от 1 месяца.', uz: 'O‘zbekiston fuqarolari uchun (Koreyaning Toshkentdagi elchixonasi, 2026): TOPIK 2 va KDB hisobida 1+ oy davomida 15 500 USD (poytaxt hududi) yoki 12 500 USD (boshqa hududlar).', uz-cyrl: 'Ўзбекистон фуқаролари учун (Кореянинг Тошкентдаги элчихонаси, 2026): TOPIK 2 ва KDB ҳисобида 1+ ой давомида 15 500 USD (пойтахт ҳудуди) ёки 12 500 USD (бошқа ҳудудлар).'}
