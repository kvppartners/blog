      again: {en: 'You held D-10 before: points now apply (60+; waived with a Korean degree from the last 3 years and TOPIK 4 or KIIP 4). D-10 time adds up while you stay in Korea (up to 3 years); if it''s used up, apply for a new D-10 visa from abroad, which restarts the count.', ru: 'У вас уже был D-10: теперь нужны баллы (60+; не нужны при корейском дипломе за последние 3 года и TOPIK 4 или KIIP 4). Время на D-10 суммируется, пока вы в Корее (до 3 лет); если оно исчерпано, оформите новую визу D-10 из-за рубежа — отсчёт начнётся заново.', uz: 'Sizda avval D-10 bo‘lgan: endi ball kerak (60+; so‘nggi 3 yildagi Koreya diplomi va TOPIK 4 yoki KIIP 4 bilan kerak emas). D-10 dagi vaqt Koreyada bo‘lganingizda jamlanadi (3 yilgacha); u tugagan bo‘lsa, chet eldan yangi D-10 vizasini oling — hisob qaytadan boshlanadi.', uz-cyrl: 'Сизда аввал D-10 бўлган: энди балл керак (60+; сўнгги 3 йилдаги Корея дипломи ва TOPIK 4 ёки KIIP 4 билан керак эмас). D-10 даги вақт Кореяда бўлганингизда жамланади (3
          йилгача); у тугаган бўлса, чет элдан янги D-10 визасини олинг — ҳисоб қайтадан бошланади.'}
