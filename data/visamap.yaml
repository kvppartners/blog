      note: {en: 'After your job ends: up to 1 year to look for a new one, without the points test.', ru: 'После окончания работы: до 1 года на поиск новой, без балльной оценки.', uz: 'Ishingiz tugagach: yangi ish qidirish uchun 1 yilgacha, ball tizimisiz.', uz-cyrl: 'Ишингиз тугагач: янги иш қидириш учун 1 йилгача, балл тизимисиз.'}
