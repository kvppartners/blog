    how: {en: 'Visa-free entry for tourism or transit, 30–90 days (6 months for Canadians); most visitors need a K-ETA. Changing status inside Korea is generally not possible.', ru: Безвизовый въезд для туризма или транзита на 30–90 дней (для граждан Канады — 6 месяцев); большинству нужна K-ETA. Сменить статус в Корее обычно нельзя., uz: Turizm yoki tranzit uchun 30–90 kunga vizasiz kirish (Kanada fuqarolari uchun 6 oy); ko‘pchilikka K-ETA kerak. Koreya ichida maqomni o‘zgartirish odatda mumkin emas., uz-cyrl: Туризм ёки транзит учун 30–90 кунга визасиз кириш (Канада фуқаролари учун 6 ой); кўпчиликка K-ETA керак. Корея ичида мақомни ўзгартириш одатда мумкин эмас.}
