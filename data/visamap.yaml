  E-7-4:
    name: {en: Skilled worker (points), ru: Квалифицированный рабочий (баллы), uz: Malakali ishchi (ball tizimi), uz-cyrl: Малакали ишчи (балл тизими)}
    how: {en: '4+ years on E-9, E-10 or H-2 in the last 10 years, TOPIK 2 or KIIP 2, an employer recommendation, 200/300 points and a contract of 2+ years at ₩26M+ a year; granted inside Korea only.', ru: '4+ года на E-9, E-10 или H-2 за последние 10 лет, TOPIK 2 или KIIP 2, рекомендация работодателя, 200/300 баллов и контракт на 2+ года с зарплатой от ₩26 млн в год; только внутри Кореи.', uz: 'So‘nggi 10 yilda E-9, E-10 yoki H-2 da 4+ yil, TOPIK 2 yoki KIIP 2, ish beruvchi tavsiyasi, 200/300 ball va yiliga ₩26 mln+ ish haqi bilan 2+ yillik shartnoma; faqat Koreya ichida beriladi.', uz-cyrl: 'Сўнгги 10 йилда E-9, E-10 ёки H-2 да 4+ йил, TOPIK 2 ёки KIIP 2, иш берувчи тавсияси, 200/300 балл ва йилига ₩26 млн+ иш ҳақи билан 2+ йиллик шартнома; фақат Корея ичида берилади.'}
    needs: {stay: {years: 4, in: [E-9, E-10, H-2]}}
    work: true
    next:
    - to: F-2-R
      note: {en: 'After 2+ years on E-7-4, with a regional recommendation.', ru: 'После 2+ лет на E-7-4, по рекомендации региона.', uz: 'E-7-4 da 2+ yildan keyin, hudud tavsiyasi bilan.', uz-cyrl: 'E-7-4 да 2+ йилдан кейин, ҳудуд тавсияси билан.'}
    - to: F-2-99
      note: {en: After 5 years on E-7 (E-9 years do not count)., ru: После 5 лет на E-7 (годы на E-9 не считаются)., uz: E-7 da 5 yildan keyin (E-9 dagi yillar hisoblanmaydi)., uz-cyrl: E-7 да 5 йилдан кейин (E-9 даги йиллар ҳисобланмайди).}
    - to: E-7-4R
      note: {en: If your workplace is in a depopulating area., ru: Если место работы находится в депопулирующем районе., uz: Ish joyingiz aholisi kamayayotgan hududda bo‘lsa., uz-cyrl: Иш жойингиз аҳолиси камаяётган ҳудудда бўлса.}
    - to: F-5-1
      note: {en: E-7 holders need a bachelor's degree for this; the usual route is via F-2-99., ru: Обладателям E-7 для этого нужен диплом бакалавра; обычно путь лежит через F-2-99., uz: E-7 egalariga buning uchun bakalavr diplomi kerak; odatda F-2-99 orqali o‘tiladi., uz-cyrl: E-7 эгаларига бунинг учун бакалавр дипломи керак; одатда F-2-99 орқали ўтилади.}
      needs: {edu: 3, stay: {years: 5, in: permanentWork}}
    - to: F-5-10
      needs: {stay: {years: 3, in: inKorea}}
      note: {en: 'Only with a technical licence on the Ministry of Justice list (or a degree in a designated field): 3+ years in Korea, full-time work at a Korean company with a wage of at least 1× GNI, and KIIP level 5. Ask immigration (1345) whether your licence level counts.', ru: 'Только с технической лицензией из списка Министерства юстиции (или дипломом в определённой области): 3+ года в Корее, работа на полную ставку в корейской компании с зарплатой не менее 1× ВНД и KIIP 5. Уточните в иммиграционной службе (1345), засчитывается ли уровень вашей лицензии.', uz: 'Faqat Adliya vazirligi ro‘yxatidagi texnik litsenziya (yoki belgilangan sohadagi diplom) bilan: Koreyada 3+ yil, Koreya kompaniyasida kamida 1× GNI maoshli to‘liq ish va KIIP 5. Litsenziyangiz darajasi hisoblanishini immigratsiya xizmatidan aniqlang (1345).', uz-cyrl: 'Фақат Адлия вазирлиги рўйхатидаги техник лицензия (ёки белгиланган соҳадаги диплом) билан: Кореяда 3+ йил, Корея компаниясида камида 1× GNI маошли тўлиқ иш ва KIIP 5. Лицензиянгиз даражаси ҳисобланишини иммиграция хизматидан аниқланг (1345).'}
