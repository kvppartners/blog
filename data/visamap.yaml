    - to: E-7-1
      abroad: true
      note: {en: 'Job offer in one of about 67 professional occupations, usually with a related degree; salary of at least ₩31.1M (2026). From a short-term stay this is normally a new visa from abroad. In Korea only if you are hired as a teacher at a foreign school or are a high-tech specialist (IT, e-business, BT, NT, new materials, transport machinery, digital electronics, environment/energy) with a recommendation from the competent ministry.', ru: 'Предложение работы по одной из ~67 профессий, обычно с профильным дипломом; зарплата от ₩31,1 млн (2026). Из краткосрочного статуса это обычно новая виза из-за рубежа. В Корее — только если вас нанимают учителем в иностранную школу или вы специалист высокотехнологичной отрасли (ИТ, электронная коммерция, BT, NT, новые материалы, транспортное машиностроение, цифровая электроника, экология и энергетика) с рекомендацией профильного министерства.', uz: 'Taxminan 67 ta kasbdan biri bo‘yicha ish taklifi, odatda tegishli diplom bilan; ish haqi kamida ₩31,1 mln (2026). Qisqa muddatli maqomdan bu odatda chet eldan yangi viza. Koreyada faqat xorijiy maktabga o‘qituvchi sifatida ishga olinsangiz yoki tegishli vazirlik tavsiyasi bilan yuqori texnologiyali soha (IT, elektron tijorat, BT, NT, yangi materiallar, transport mashinasozligi, raqamli elektronika, ekologiya va energetika) mutaxassisi bo‘lsangiz.', uz-cyrl: 'Тахминан 67 та касбдан бири бўйича иш таклифи, одатда тегишли диплом билан; иш ҳақи камида ₩31,1 млн (2026). Қисқа муддатли мақомдан бу одатда чет элдан янги виза. Кореяда фақат хорижий мактабга ўқитувчи сифатида ишга олинсангиз ёки тегишли вазирлик тавсияси билан юқори технологияли соҳа (IT, электрон тижорат, BT, NT, янги материаллар, транспорт машинасозлиги, рақамли электроника, экология ва энергетика) мутахассиси бўлсангиз.'}
    - {to: E-9, abroad: true}
    - to: F-6-1
      abroad: true
      note: {en: 'Legal marriage to a Korean citizen. The Korean spouse needs a yearly income of about ₩25.2M for a couple (2026; not needed if you have a child together), you need basic Korean (TOPIK 1) or a shared language, and a real home. From a short-term stay you normally need a new visa from abroad; a change in Korea is allowed only if leaving is unavoidable because of pregnancy, childbirth or raising your own (not adopted) child together.', ru: 'Законный брак с гражданином Кореи. Супругу-корейцу нужен годовой доход около ₩25,2 млн на семью из двух человек (2026; не нужен при общем ребёнке), вам — базовый корейский (TOPIK 1) или общий язык, и нужно настоящее жильё. Из краткосрочного статуса обычно нужна новая виза из-за рубежа; сменить статус в Корее можно, только если выехать нельзя из-за беременности, родов или воспитания вашего общего (не приёмного) ребёнка.', uz: 'Koreya fuqarosi bilan qonuniy nikoh. Koreyalik turmush o‘rtog‘ingizning yillik daromadi ikki kishi uchun taxminan ₩25,2 mln bo‘lishi kerak (2026; umumiy farzand bo‘lsa, kerak emas), sizga boshlang‘ich koreys tili (TOPIK 1) yoki umumiy til va haqiqiy uy-joy kerak. Qisqa muddatli maqomdan odatda chet eldan yangi viza kerak; Koreyada maqomni o‘zgartirish faqat homiladorlik, tug‘ruq yoki umumiy (asrab olinmagan) farzandingizni tarbiyalash sababli chiqib ketishning iloji bo‘lmasa mumkin.', uz-cyrl: 'Корея фуқароси билан қонуний никоҳ. Кореялик турмуш ўртоғингизнинг йиллик даромади икки киши учун тахминан ₩25,2 млн бўлиши керак (2026; умумий фарзанд бўлса, керак эмас), сизга бошланғич корейс тили (TOPIK 1) ёки умумий тил ва ҳақиқий уй-жой керак. Қисқа муддатли мақомдан одатда чет элдан янги виза керак; Кореяда мақомни ўзгартириш фақат ҳомиладорлик, туғруқ ёки умумий (асраб олинмаган) фарзандингизни тарбиялаш сабабли чиқиб кетишнинг иложи бўлмаса мумкин.'}
