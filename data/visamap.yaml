    how: {en: 'High-tech bachelor''s, Korean STEM bachelor''s, Korean master''s or engineer licence; 3+ years'' work in Korea; own income of 1× GNI; KIIP level 5.', ru: 'Бакалавр в hi-tech, корейский бакалавр STEM, корейская магистратура или лицензия инженера; 3+ года работы в Корее; свой доход 1× ВНД; KIIP 5.', uz: 'Yuqori texnologiyalar bakalavri, Koreya STEM bakalavri, Koreya magistraturasi yoki muhandis litsenziyasi; Koreyada 3+ yil ish; shaxsiy daromad 1× GNI; KIIP 5.', uz-cyrl: 'Юқори технологиялар бакалаври, Корея STEM бакалаври, Корея магистратураси ёки муҳандис лицензияси; Кореяда 3+ йил иш; шахсий даромад 1× GNI; KIIP 5.'}
