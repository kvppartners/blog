    how: {en: Doctorate from a Korean university's regular program and 1+ year full-time at a Korean company; income of 1× GNI., ru: Докторская степень по очной программе корейского вуза и 1+ год работы в корейской компании; доход 1× ВНД., uz: Koreya universitetining asosiy dasturida doktorlik va Koreya kompaniyasida 1+ yil to‘liq ish; daromad 1× GNI., uz-cyrl: Корея университетининг асосий дастурида докторлик ва Корея компаниясида 1+ йил тўлиқ иш; даромад 1× GNI.}
