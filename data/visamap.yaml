    - to: F-6-1
      abroad: true
      note: {en: 'Legal marriage to a Korean citizen. The Korean spouse needs a yearly income of about ₩25.2M for a couple (2026; not needed if you have a child together), you need basic Korean (TOPIK 1) or a shared language, and a real home. From a short-term stay you normally need a new visa from abroad; a change in Korea is allowed only if leaving is unavoidable because of pregnancy, childbirth or raising your own (not adopted) child together.', ru: 'Законный брак с гражданином Кореи. Супругу-корейцу нужен годовой доход около ₩25,2 млн на семью из двух человек (2026; не нужен при общем ребёнке), вам — базовый корейский (TOPIK 1) или общий язык, и нужно настоящее жильё. Из краткосрочного статуса обычно нужна новая виза из-за рубежа; сменить статус в Корее можно, только если выехать нельзя из-за беременности, родов или воспитания вашего общего (не приёмного) ребёнка.', uz: 'Koreya fuqarosi bilan qonuniy nikoh. Koreyalik turmush o‘rtog‘ingizning yillik daromadi ikki kishi uchun taxminan ₩25,2 mln bo‘lishi kerak (2026; umumiy farzand bo‘lsa, kerak emas), sizga boshlang‘ich koreys tili (TOPIK 1) yoki umumiy til va haqiqiy uy-joy kerak. Qisqa muddatli maqomdan odatda chet eldan yangi viza kerak; Koreyada maqomni o‘zgartirish faqat homiladorlik, tug‘ruq yoki umumiy (asrab olinmagan) farzandingizni tarbiyalash sababli chiqib ketishning iloji bo‘lmasa mumkin.', uz-cyrl: 'Корея фуқароси билан қонуний никоҳ. Кореялик турмуш ўртоғингизнинг йиллик даромади икки киши учун тахминан ₩25,2 млн бўлиши керак (2026; умумий фарзанд бўлса, керак эмас), сизга бошланғич корейс тили (TOPIK 1) ёки умумий тил ва ҳақиқий уй-жой керак. Қисқа муддатли мақомдан одатда чет элдан янги виза керак; Кореяда мақомни ўзгартириш фақат ҳомиладорлик, туғруқ ёки умумий (асраб олинмаган) фарзандингизни тарбиялаш сабабли чиқиб кетишнинг иложи бўлмаса мумкин.'}
    - to: F-4
      abroad: true
      note: {en: 'Ethnic Korean of any nationality: former Korean citizen or descendant (men who gave up Korean nationality without military service: only from the year they turn 41). From a short-term stay this is normally a new visa from abroad; you can change in Korea if your proof of Korean descent is issued in Korea or can be checked in the immigration system, or if you are an ethnic Korean from a CIS country who held C-3-8, H-2 or F-4 before.', ru: 'Этнический кореец любого гражданства: бывший гражданин Кореи или потомок (мужчины, отказавшиеся от гражданства Кореи без военной службы, — только с года, когда им исполнится 41). Из краткосрочного статуса это обычно новая виза из-за рубежа; сменить статус в Корее можно, если документы о корейском происхождении выданы в Корее или проверяются в иммиграционной системе, либо если вы этнический кореец из страны СНГ и раньше имели визу C-3-8, H-2 или F-4.', uz: 'Har qanday fuqarolikdagi etnik koreys: Koreyaning sobiq fuqarosi yoki avlodi (harbiy xizmatsiz Koreya fuqaroligidan chiqqan erkaklar — faqat 41 yoshga to‘ladigan yildan). Qisqa muddatli maqomdan bu odatda chet eldan yangi viza; koreys kelib chiqishingizni tasdiqlovchi hujjatlar Koreyada berilgan yoki immigratsiya tizimida tekshirilishi mumkin bo‘lsa yoxud siz avval C-3-8, H-2 yoki F-4 vizasini olgan MDH davlatidan bo‘lgan etnik koreys bo‘lsangiz, Koreyada maqomni o‘zgartirish mumkin.', uz-cyrl: 'Ҳар қандай фуқароликдаги этник корейс: Кореянинг собиқ фуқароси ёки авлоди (ҳарбий хизматсиз Корея фуқаролигидан чиққан эркаклар — фақат 41 ёшга тўладиган йилдан). Қисқа муддатли мақомдан бу одатда чет элдан янги виза; корейс келиб чиқишингизни тасдиқловчи ҳужжатлар Кореяда берилган ёки иммиграция тизимида текширилиши мумкин бўлса ёхуд сиз аввал C-3-8, H-2 ёки F-4 визасини олган МДҲ давлатидан бўлган этник корейс бўлсангиз, Кореяда мақомни ўзгартириш мумкин.'}
    - F-2-8
    - to: F-2-81
      note: {en: 'As the spouse or unmarried child of a tourism/resort investor (F-2-8), together with or after the investor.', ru: 'Как супруг(а) или ребёнок, не состоящий в браке, инвестора в туризм/курорты (F-2-8) — вместе с инвестором или после него.', uz: 'Turizm/kurort investorining (F-2-8) turmush o‘rtog‘i yoki turmush qurmagan farzandi sifatida, investor bilan birga yoki undan keyin.', uz-cyrl: 'Туризм/курорт инвесторининг (F-2-8) турмуш ўртоғи ёки турмуш қурмаган фарзанди сифатида, инвестор билан бирга ёки ундан кейин.'}
    - F-2-12
    - to: F-2-13
      note: {en: 'As the spouse or unmarried child of a public-interest investor (F-2-12), together with or after the investor.', ru: 'Как супруг(а) или ребёнок, не состоящий в браке, инвестора в общественные проекты (F-2-12) — вместе с инвестором или после него.', uz: 'Jamoat loyihalari investorining (F-2-12) turmush o‘rtog‘i yoki turmush qurmagan farzandi sifatida, investor bilan birga yoki undan keyin.', uz-cyrl: 'Жамоат лойиҳалари инвесторининг (F-2-12) турмуш ўртоғи ёки турмуш қурмаган фарзанди сифатида, инвестор билан бирга ёки ундан кейин.'}
    - F-5-25
    - D-9-4
    - {to: F-2-3, abroad: true}
    - to: F-3
      abroad: true
      note: {en: 'Spouse or minor child of a D, E or F-2 status holder. From a short-term stay you need a new visa from abroad; a change in Korea is allowed only on humanitarian grounds such as pregnancy, birth, child-raising or illness.', ru: 'Супруг(а) или несовершеннолетний ребёнок обладателя статуса D, E или F-2. При краткосрочном пребывании нужна новая виза из-за рубежа; смена статуса в Корее допускается только по гуманитарным причинам, таким как беременность, роды, воспитание ребёнка или болезнь.', uz: 'D, E yoki F-2 maqomi egasining turmush o‘rtog‘i yoki voyaga yetmagan farzandi. Qisqa muddatli maqomdan chet eldan yangi viza kerak; Koreyada maqomni o‘zgartirish faqat homiladorlik, tug‘ruq, farzand tarbiyalash yoki kasallik kabi insonparvarlik sabablari bilan mumkin.', uz-cyrl: 'D, E ёки F-2 мақоми эгасининг турмуш ўртоғи ёки вояга етмаган фарзанди. Қисқа муддатли мақомдан чет элдан янги виза керак; Кореяда мақомни ўзгартириш фақат ҳомиладорлик, туғруқ, фарзанд тарбиялаш ёки касаллик каби инсонпарварлик сабаблари билан мумкин.'}
  C-3-4:
    name: {en: Business visitor, ru: Деловой визит, uz: Ishbilarmonlik tashrifi, uz-cyrl: Ишбилармонлик ташрифи}
    how: {en: 'Up to 90 days for meetings, market research and contracts. No paid work.', ru: 'До 90 дней: встречи, изучение рынка, контракты. Без оплачиваемой работы.', uz: '90 kungacha: uchrashuvlar, bozorni o‘rganish, shartnomalar. Haq to‘lanadigan ish yo‘q.', uz-cyrl: '90 кунгача: учрашувлар, бозорни ўрганиш, шартномалар. Ҳақ тўланадиган иш йўқ.'}
    years: [0, 0.25]
    next:
