visas:
  B-1:
    name: {en: Visa-free entry, ru: Безвизовый въезд, uz: Vizasiz kirish, uz-cyrl: Визасиз кириш}
    how: {en: Visa-free stay of 30–90 days under a visa-waiver agreement; most visitors need a K-ETA. Long-term statuses usually need a new visa from abroad., ru: Безвизовое пребывание на 30–90 дней по соглашению; большинству нужна K-ETA. Для долгосрочных статусов обычно нужна новая виза из-за рубежа., uz: Vizasiz kelishuv bo‘yicha 30–90 kungacha bo‘lish; ko‘pchilikka K-ETA kerak. Uzoq muddatli maqomlar uchun odatda chet eldan yangi viza kerak., uz-cyrl: Визасиз келишув бўйича 30–90 кунгача бўлиш; кўпчиликка K-ETA керак. Узоқ муддатли мақомлар учун одатда чет элдан янги виза керак.}
    next:
    - {to: D-4-1, abroad: true}
    - to: D-2-1
      abroadFor: notified
      note: {en: In Korea only for citizens of some countries and if the course starts before your stay ends; otherwise apply from abroad., ru: В Корее — только для граждан некоторых стран и если учёба начинается до окончания пребывания; иначе — подача из-за рубежа., uz: Koreyada faqat ayrim davlatlar fuqarolari uchun va o‘qish qolish muddati tugashidan oldin boshlansa; aks holda chet eldan topshiriladi., uz-cyrl: Кореяда фақат айрим давлатлар фуқаролари учун ва ўқиш қолиш муддати тугашидан олдин бошланса; акс ҳолда чет элдан топширилади.}
