  G-1-5:
    name: {en: Refugee applicant, ru: Заявитель на статус беженца, uz: Qochqin maqomiga ariza beruvchi, uz-cyrl: Қочқин мақомига ариза берувчи}
    how: {en: Waiting for a decision on a refugee application., ru: Ожидание решения по заявлению о статусе беженца., uz: Qochqin maqomi bo‘yicha arizaga qaror kutilmoqda., uz-cyrl: Қочқин мақоми бўйича аризага қарор кутилмоқда.}
    next:
    - F-2-4
    - to: G-1-6
      note: {en: 'Only if refugee status is refused and the Ministry of Justice grants a humanitarian stay permit instead; it is decided by the Ministry, not applied for.', ru: 'Только если в статусе беженца отказано, а Минюст вместо этого разрешает гуманитарное пребывание; это решение министерства, подать на него заявление нельзя.', uz: 'Faqat qochqin maqomi rad etilib, Adliya vazirligi uning o‘rniga insonparvarlik asosida qolishga ruxsat bersa; buni vazirlik hal qiladi, unga ariza berilmaydi.', uz-cyrl: 'Фақат қочқин мақоми рад этилиб, Адлия вазирлиги унинг ўрнига инсонпарварлик асосида қолишга рухсат берса; буни вазирлик ҳал қилади, унга ариза берилмайди.'}
    - to: D-10-1
      note: {en: "Bachelor's degree and 60+ points (80+ for citizens of the 21 notified countries, including Uzbekistan); 1 year in total, 3 years with 80+ points.", ru: 'Диплом бакалавра и 60+ баллов (80+ для граждан 21 страны из особого списка, включая Узбекистан); всего 1 год, при 80+ баллах — 3 года.', uz: 'Bakalavr diplomi va 60+ ball (maxsus ro‘yxatdagi 21 davlat, jumladan O‘zbekiston fuqarolari uchun 80+); jami 1 yil, 80+ ball bilan 3 yil.', uz-cyrl: 'Бакалавр дипломи ва 60+ балл (махсус рўйхатдаги 21 давлат, жумладан Ўзбекистон фуқаролари учун 80+); жами 1 йил, 80+ балл билан 3 йил.'}
  G-1-6:
    name: {en: Humanitarian stay, ru: Гуманитарное пребывание, uz: Insonparvarlik asosida bo‘lish, uz-cyrl: Инсонпарварлик асосида бўлиш}
    how: {en: 'Refugee status refused, but a humanitarian stay was granted.', ru: 'В статусе беженца отказано, но разрешено гуманитарное пребывание.', uz: 'Qochqin maqomi rad etilgan, ammo insonparvarlik asosida qolishga ruxsat berilgan.', uz-cyrl: 'Қочқин мақоми рад этилган, аммо инсонпарварлик асосида қолишга рухсат берилган.'}
    next:
    - D-2-2
    - D-4-1
    - to: D-10-1
      note: {en: "Bachelor's degree and 60+ points (80+ for citizens of the 21 notified countries, including Uzbekistan); 1 year in total, 3 years with 80+ points.", ru: 'Диплом бакалавра и 60+ баллов (80+ для граждан 21 страны из особого списка, включая Узбекистан); всего 1 год, при 80+ баллах — 3 года.', uz: 'Bakalavr diplomi va 60+ ball (maxsus ro‘yxatdagi 21 davlat, jumladan O‘zbekiston fuqarolari uchun 80+); jami 1 yil, 80+ ball bilan 3 yil.', uz-cyrl: 'Бакалавр дипломи ва 60+ балл (махсус рўйхатдаги 21 давлат, жумладан Ўзбекистон фуқаролари учун 80+); жами 1 йил, 80+ балл билан 3 йил.'}
  F-5-1:
    name: {en: After 5 years of work or business, ru: После 5 лет работы или бизнеса, uz: 5 yillik ish yoki biznesdan so‘ng, uz-cyrl: 5 йиллик иш ёки бизнесдан сўнг}
    how: {en: "5+ years in Korea on D-7 to E-7 (D-10 included) or F-2, age 19+; household income of 2× GNI or net assets of 1.5× the national household average; KIIP level 5 or the PR integration test (60+). If you apply while on E-7 or D-10: a bachelor's degree and a job.", ru: '5+ лет в Корее в статусах D-7–E-7 (включая D-10) или F-2, возраст 19+; доход семьи 2× ВНД или чистые активы 1,5× от среднего по стране на семью; KIIP 5 или интеграционный тест для ПМЖ (60+ баллов). Если вы подаёте заявление со статусом E-7 или D-10: диплом бакалавра и работа.', uz: 'Koreyada D-7–E-7 (D-10 ham kiradi) yoki F-2 da 5+ yil, yosh 19+; oila daromadi 2× GNI yoki sof aktivlar mamlakatdagi oilalar o‘rtachasidan 1,5×; KIIP 5 yoki doimiy yashash uchun integratsiya testi (60+ ball). E-7 yoki D-10 da turib ariza bersangiz: bakalavr diplomi va ish.', uz-cyrl: 'Кореяда D-7–E-7 (D-10 ҳам киради) ёки F-2 да 5+ йил, ёш 19+; оила даромади 2× GNI ёки соф активлар мамлакатдаги оилалар ўртачасидан 1,5×; KIIP 5 ёки доимий яшаш учун интеграция тести (60+ балл). E-7 ёки D-10 да туриб ариза берсангиз: бакалавр дипломи ва иш.'}
    age: [19]
    lang: {kiip: 5}
    income: {gni: 2, household: true, assets: {average: 1.5}}
    needs: {stay: {years: 5, in: permanentWork}}
  F-5-2:
    name: {en: Spouse of a Korean citizen, ru: Супруг(а) гражданина Кореи, uz: Koreya fuqarosining turmush o‘rtog‘i, uz-cyrl: Корея фуқаросининг турмуш ўртоғи}
    how: {en: "2+ years in Korea as the spouse of a Korean citizen (F-6): still married, raising your child together, or after a marriage that ended through no fault of yours. Household income of 1× GNI or household assets at the national median (80% when raising a child, pregnant, in infertility treatment, supporting your spouse's parents, or 60+); KIIP level 5 or the PR integration test.", ru: '2+ года в Корее в статусе супруга(-и) гражданина Кореи (F-6): брак продолжается, вы воспитываете общего ребёнка или брак прекращён не по вашей вине. Доход семьи 1× ВНД или активы семьи на уровне медианы по стране (80% при воспитании ребёнка, беременности, лечении бесплодия, заботе о родителях супруга или в возрасте 60+); KIIP 5 или интеграционный тест для ПМЖ.', uz: 'Koreya fuqarosining turmush o‘rtog‘i (F-6) sifatida Koreyada 2+ yil: nikoh davom etmoqda, umumiy farzandingizni tarbiyalayapsiz yoki nikoh sizning aybingizsiz tugagan. Oila daromadi 1× GNI yoki mamlakat medianasi darajasidagi oila aktivlari (farzand tarbiyalash, homiladorlik, bepushtlikni davolash, turmush o‘rtog‘ingizning ota-onasini boqish yoki 60+ yoshda — 80%); KIIP 5 yoki doimiy yashash uchun integratsiya testi.', uz-cyrl: 'Корея фуқаросининг турмуш ўртоғи (F-6) сифатида Кореяда 2+ йил: никоҳ давом этмоқда, умумий фарзандингизни тарбиялаяпсиз ёки никоҳ сизнинг айбингизсиз тугаган. Оила даромади 1× GNI ёки мамлакат медианаси даражасидаги оила активлари (фарзанд тарбиялаш, ҳомиладорлик, бепуштликни даволаш, турмуш ўртоғингизнинг ота-онасини боқиш ёки 60+ ёшда — 80%); KIIP 5 ёки доимий яшаш учун интеграция тести.'}
    lang: {kiip: 5}
    income: {gni: 1, household: true, assets: {median: true}, cuts: [marriageRelief]}
    needs: {stay: {years: 2, in: [F-6]}}
  F-5-3:
    name: {en: Minor child of a Korean citizen, ru: Ребёнок гражданина Кореи, uz: Koreya fuqarosining farzandi, uz-cyrl: Корея фуқаросининг фарзанди}
    how: {en: 'Minor child of a Korean citizen with 2+ years on F-2-2, still under 19 when applying; no income test; KIIP level 5 or the integration test, unless you attend or finished regular Korean school.', ru: 'Несовершеннолетний ребёнок гражданина Кореи после 2+ лет на F-2-2, при подаче заявления ещё младше 19 лет; без требования к доходу; KIIP 5 или интеграционный тест, если вы не учитесь в корейской общеобразовательной школе и не окончили её.', uz: 'F-2-2 da 2+ yildan keyin Koreya fuqarosining voyaga yetmagan farzandi, ariza berishda hali 19 yoshga to‘lmagan; daromad talab qilinmaydi; KIIP 5 yoki integratsiya testi, Koreya umumta’lim maktabida o‘qiyotgan yoki uni tugatganlar bundan mustasno.', uz-cyrl: 'F-2-2 да 2+ йилдан кейин Корея фуқаросининг вояга етмаган фарзанди, ариза беришда ҳали 19 ёшга тўлмаган; даромад талаб қилинмайди; KIIP 5 ёки интеграция тести, Корея умумтаълим мактабида ўқиётган ёки уни тугатганлар бундан мустасно.'}
    age: [0, 18]
    needs: {stay: {years: 2, in: [F-2-2]}}
    lang: {kiip: 5, koreanEdu: 1}
  F-5-4:
    name: {en: Family of a permanent resident, ru: Семья обладателя ПМЖ, uz: Doimiy yashovchining oilasi, uz-cyrl: Доимий яшовчининг оиласи}
    how: {en: Spouse or minor child of a permanent resident after 2+ years in Korea on F-2-3 (the F-5 holder needs no waiting period); household income of 1× GNI or assets; KIIP level 5 or the integration test (not for children under 15 or in Korean school)., ru: Супруг(а) или несовершеннолетний ребёнок обладателя ПМЖ после 2+ лет в Корее на F-2-3 (для обладателя F-5 срок ожидания не требуется); доход семьи 1× ВНД или активы; KIIP 5 или интеграционный тест (не для детей до 15 лет и учащихся корейской школы)., uz: Koreyada F-2-3 da 2+ yildan keyin doimiy yashovchining turmush o‘rtog‘i yoki voyaga yetmagan farzandi (F-5 egasi uchun kutish muddati yo‘q); oila daromadi 1× GNI yoki aktivlar; KIIP 5 yoki integratsiya testi (15 yoshgacha bo‘lgan bolalar va Koreya maktabida o‘qiyotganlar uchun emas)., uz-cyrl: Кореяда F-2-3 да 2+ йилдан кейин доимий яшовчининг турмуш ўртоғи ёки вояга етмаган фарзанди (F-5 эгаси учун кутиш муддати йўқ); оила даромади 1× GNI ёки активлар; KIIP 5 ёки интеграция тести (15 ёшгача бўлган болалар ва Корея мактабида ўқиётганлар учун эмас).}
    lang: {kiip: 5}
    income: {gni: 1, household: true, assets: {route: true}}
    needs: {stay: {years: 2, in: [F-2-3]}}
  F-5-5:
    name: {en: Large investor, ru: Крупный инвестор, uz: Yirik investor, uz-cyrl: Йирик инвестор}
    how: {en: US$500K+ investment and 5+ Korean full-time employees for 6+ months; no minimum stay., ru: Инвестиции от 500 тыс. USD и 5+ корейских штатных сотрудников от 6 месяцев; без минимального срока пребывания., uz: 500 ming USD+ investitsiya va 6+ oy davomida 5+ koreys shtat xodimi; eng kam qolish muddati yo‘q., uz-cyrl: 500 минг USD+ инвестиция ва 6+ ой давомида 5+ корейс штат ходими; энг кам қолиш муддати йўқ.}
    needs: {invest: 3}
  F-5-6:
    name: {en: Overseas Korean, ru: Этнический кореец, uz: Xorijdagi koreys, uz-cyrl: Хориждаги корейс}
    how: {en: '2+ years on F-4. Household income of 1× GNI with at least half of it your own (lower with KIIP 5, a Korean school or degree, or 100+ hours of volunteering), or another route: own net assets at the national household average, ₩500K+ of property tax last year, a pension from abroad of 1× GNI at 60+, ₩2bn of trade with Korea, US$500K invested, or a recommendation as a community leader. No KIIP needed.', ru: '2+ года на F-4. Доход семьи 1× ВНД, из которого не менее половины — ваш собственный (ниже при KIIP 5, корейской школе или корейском дипломе либо 100+ часах волонтёрства), или другой путь: собственные чистые активы на уровне среднего по стране на семью, налог на имущество от ₩500 тыс. за прошлый год, пенсия из-за рубежа 1× ВНД с 60 лет, торговля с Кореей на ₩2 млрд, инвестиции US$500 тыс. или рекомендация как лидера общины. KIIP не нужен.', uz: 'F-4 da 2+ yil. Oila daromadi 1× GNI, kamida yarmi o‘zingizniki (KIIP 5, Koreya maktabi yoki diplomi, yoxud 100+ soat ko‘ngillilik bilan pastroq), yoki boshqa yo‘l: mamlakatdagi oilalar o‘rtachasi darajasida shaxsiy sof aktivlar, o‘tgan yili ₩500 ming+ mol-mulk solig‘i, 60 yoshdan 1× GNI miqdorida xorijdan pensiya, Koreya bilan ₩2 mlrd savdo, US$500 ming investitsiya yoki jamoa yetakchisi sifatida tavsiya. KIIP talab qilinmaydi.', uz-cyrl: 'F-4 да 2+ йил. Оила даромади 1× GNI, камида ярми ўзингизники (KIIP 5, Корея мактаби ёки дипломи, ёхуд 100+ соат кўнгиллилик билан пастроқ), ёки бошқа йўл: мамлакатдаги оилалар ўртачаси даражасида шахсий соф активлар, ўтган йили ₩500 минг+ мол-мулк солиғи, 60 ёшдан 1× GNI миқдорида хориждан пенсия, Корея билан ₩2 млрд савдо, US$500 минг инвестиция ёки жамоа етакчиси сифатида тавсия. KIIP талаб қилинмайди.'}
    needs: {korean: true, stay: {years: 2, in: [F-4]}}
    gives: *id001
    income: {gni: 1, household: true, ownHalf: true, assets: {average: 1, own: true}, cuts: [volunteer, koreanSkill, koreanSkillVolunteer]}
  F-5-6R:
    name: {en: Regional overseas Korean, ru: Этнический кореец (регион), uz: Hududiy xorijdagi koreys, uz-cyrl: Ҳудудий хориждаги корейс}
    how: {en: 'Regional overseas Korean (F-4-R) who has lived in the recommended depopulating area for 4+ years (2 years for those who were already there): household income of 70% of GNI instead of the full F-5-6 bar. Immigration handles it as F-5-6.', ru: 'Этнический кореец по региональной программе (F-4-R), проживший 4+ года в рекомендованном депопулирующем районе (2 года для тех, кто уже жил там): доход семьи 70% ВНД вместо полного порога F-5-6. Иммиграционная служба оформляет его как F-5-6.', uz: 'Hududiy xorijdagi koreys (F-4-R), tavsiya etilgan aholisi kamayayotgan hududda 4+ yil yashagan (u yerda avvaldan yashaganlar uchun 2 yil): F-5-6 ning to‘liq chegarasi o‘rniga oila daromadi GNI ning 70%. Immigratsiya xizmati uni F-5-6 sifatida rasmiylashtiradi.', uz-cyrl: 'Ҳудудий хориждаги корейс (F-4-R), тавсия этилган аҳолиси камаяётган ҳудудда 4+ йил яшаган (у ерда аввалдан яшаганлар учун 2 йил): F-5-6 нинг тўлиқ чегараси ўрнига оила даромади GNI нинг 70%. Иммиграция хизмати уни F-5-6 сифатида расмийлаштиради.'}
    needs: *id001
    income: {gni: 0.7, household: true}
    gives: *id001
  F-5-7:
    name: {en: Ethnic Korean eligible for nationality, ru: Этнический кореец с правом на гражданство, uz: Fuqarolik olish huquqiga ega etnik koreys, uz-cyrl: Фуқаролик олиш ҳуқуқига эга этник корейс}
    how: {en: Ethnic Korean who already meets the requirements for Korean naturalization or nationality restoration; for the general and simplified naturalization routes also KIIP level 5 or the integration test., ru: 'Этнический кореец, уже отвечающий требованиям натурализации или восстановления гражданства Кореи; для общей и упрощённой натурализации также KIIP 5 или интеграционный тест.', uz: Koreya fuqaroligini olish yoki tiklash talablariga allaqachon javob beradigan etnik koreys; umumiy va soddalashtirilgan tartibda fuqarolikka qabul qilishda KIIP 5 yoki integratsiya testi ham kerak., uz-cyrl: Корея фуқаролигини олиш ёки тиклаш талабларига аллақачон жавоб берадиган этник корейс; умумий ва соддалаштирилган тартибда фуқароликка қабул қилишда KIIP 5 ёки интеграция тести ҳам керак.}
    needs: *id001
    gives: *id001
    lang: {kiip: 5}
  F-5-9:
    name: {en: High-tech doctorate (foreign), ru: Иностранная докторская степень в hi-tech, uz: Yuqori texnologiyalar bo‘yicha xorijiy doktorlik, uz-cyrl: Юқори технологиялар бўйича хорижий докторлик}
    how: {en: Foreign doctorate in a high-tech field and regular employment in that field at a Korean company when you apply; income of 1× GNI or assets; no KIIP needed., ru: Иностранная докторская степень в высокотехнологичной области и штатная работа в этой области в корейской компании на момент подачи заявления; доход 1× ВНД или активы; KIIP не нужен., uz: Yuqori texnologiyalar sohasida xorijiy doktorlik va ariza berish paytida Koreya kompaniyasida shu sohada shtat xodimi sifatida ishlash; daromad 1× GNI yoki aktivlar; KIIP talab qilinmaydi., uz-cyrl: Юқори технологиялар соҳасида хорижий докторлик ва ариза бериш пайтида Корея компаниясида шу соҳада штат ходими сифатида ишлаш; даромад 1× GNI ёки активлар; KIIP талаб қилинмайди.}
    needs: {edu: 5, stem: true}
    income: {gni: 1, assets: {route: true}}
  F-5-10:
    name: {en: Degree or licence holder, ru: Обладатель диплома или лицензии, uz: Diplom yoki litsenziya egasi, uz-cyrl: Диплом ёки лицензия эгаси}
    how: {en: "A high-tech bachelor's, a Korean STEM bachelor's, a Korean master's or a listed licence; 3+ years of residence in Korea and 1+ year of regular work at a Korean company; your own wage of 1× GNI; KIIP level 5 or the integration test.", ru: 'Бакалавр в hi-tech, корейский бакалавр STEM, корейская магистратура или лицензия из списка; 3+ года проживания в Корее и 1+ год штатной работы в корейской компании; собственная зарплата 1× ВНД; KIIP 5 или интеграционный тест.', uz: 'Yuqori texnologiyalar bakalavri, Koreya STEM bakalavri, Koreya magistraturasi yoki ro‘yxatdagi litsenziya; Koreyada 3+ yil yashash va Koreya kompaniyasida 1+ yil shtat xodimi sifatida ishlash; shaxsiy ish haqi 1× GNI; KIIP 5 yoki integratsiya testi.', uz-cyrl: 'Юқори технологиялар бакалаври, Корея STEM бакалаври, Корея магистратураси ёки рўйхатдаги лицензия; Кореяда 3+ йил яшаш ва Корея компаниясида 1+ йил штат ходими сифатида ишлаш; шахсий иш ҳақи 1× GNI; KIIP 5 ёки интеграция тести.'}
    needs: {stay: {years: 3, in: inKorea}}
    lang: {kiip: 5}
    income: {gni: 1}
  F-5-11:
    name: {en: Outstanding ability, ru: Выдающиеся способности, uz: Alohida qobiliyat, uz-cyrl: Алоҳида қобилият}
    how: {en: 'Internationally recognised achievement in science, business, education, arts or sport (for example a major international prize, a world-class research record or key patents): 30+ points on the mandatory items and 50+ in total on the points table; from abroad, the visa needs Ministry of Justice approval.', ru: 'Международно признанные достижения в науке, бизнесе, образовании, искусстве или спорте (например, крупная международная премия, исследования мирового уровня или ключевые патенты): 30+ баллов по обязательным пунктам и 50+ баллов в сумме по балльной таблице; из-за рубежа виза выдаётся с одобрения Минюста.', uz: 'Fan, biznes, ta’lim, san’at yoki sportda xalqaro miqyosda e’tirof etilgan yutuqlar (masalan, yirik xalqaro mukofot, jahon darajasidagi ilmiy natijalar yoki muhim patentlar): ball jadvalida majburiy bandlar bo‘yicha 30+ ball va jami 50+ ball; chet eldan viza Adliya vazirligi roziligi bilan beriladi.', uz-cyrl: 'Фан, бизнес, таълим, санъат ёки спортда халқаро миқёсда эътироф этилган ютуқлар (масалан, йирик халқаро мукофот, жаҳон даражасидаги илмий натижалар ёки муҳим патентлар): балл жадвалида мажбурий бандлар бўйича 30+ балл ва жами 50+ балл; чет элдан виза Адлия вазирлиги розилиги билан берилади.'}
  F-5-13:
    name: {en: Pensioner, ru: Пенсионер, uz: Pensioner, uz-cyrl: Пенсионер}
    how: {en: Age 60+ with your own pension from abroad of at least 2× GNI a year (no asset route); no KIIP needed., ru: Возраст 60+ и собственная пенсия из-за рубежа не менее 2× ВНД в год (без варианта с активами); KIIP не нужен., uz: Yosh 60+ va yiliga kamida 2× GNI miqdorida xorijdan shaxsiy pensiya (aktivlar varianti yo‘q); KIIP talab qilinmaydi., uz-cyrl: Ёш 60+ ва йилига камида 2× GNI миқдорида хориждан шахсий пенсия (активлар варианти йўқ); KIIP талаб қилинмайди.}
    age: [60]
  F-5-14:
    name: {en: Long-serving H-2 worker, ru: Работник H-2 со стажем, uz: Uzoq ishlagan H-2 ishchisi, uz-cyrl: Узоқ ишлаган H-2 ишчиси}
    how: {en: "4+ years with the same employer in manufacturing, farming, fishing, care or domestic work on H-2 (years after changing to F-4 count, and a forced move within 3 months to the same industry doesn't break them); a listed licence or your own income of 70% of GNI.", ru: '4+ года на H-2 у одного работодателя в производстве, сельском хозяйстве, рыболовстве, уходе или домашнем труде (годы после перехода на F-4 засчитываются, а вынужденный переход к другому работодателю той же отрасли в течение 3 месяцев их не прерывает); квалификационный сертификат из списка или собственный доход 70% ВНД.', uz: 'Ishlab chiqarish, qishloq xo‘jaligi, baliqchilik, parvarish yoki uy ishlari sohasida H-2 da bitta ish beruvchida 4+ yil (F-4 ga o‘tgandan keyingi yillar ham hisoblanadi, 3 oy ichida shu sohadagi boshqa ish joyiga majburiy o‘tilsa ham muddat uzilmaydi); ro‘yxatdagi malaka sertifikati yoki GNI ning 70% miqdorida shaxsiy daromad.', uz-cyrl: 'Ишлаб чиқариш, қишлоқ хўжалиги, балиқчилик, парвариш ёки уй ишлари соҳасида H-2 да битта иш берувчида 4+ йил (F-4 га ўтгандан кейинги йиллар ҳам ҳисобланади, 3 ой ичида шу соҳадаги бошқа иш жойига мажбурий ўтилса ҳам муддат узилмайди); рўйхатдаги малака сертификати ёки GNI нинг 70% миқдорида шахсий даромад.'}
    needs: {korean: true, stay: {years: 4, in: [H-2, F-4]}}
    income: {gni: 0.7, cuts: [licence]}
    gives: *id001
  F-5-15:
    name: {en: Korean doctorate holder, ru: Докторская степень корейского вуза, uz: Koreya doktorlik darajasi egasi, uz-cyrl: Корея докторлик даражаси эгаси}
    how: {en: Doctorate from a Korean university's regular program and regular employment at a Korean company when you apply; income of 1× GNI or assets; no KIIP needed., ru: Докторская степень по очной программе корейского вуза и штатная работа в корейской компании на момент подачи заявления; доход 1× ВНД или активы; KIIP не нужен., uz: Koreya universitetining asosiy dasturida doktorlik va ariza berish paytida Koreya kompaniyasida shtat xodimi sifatida ishlash; daromad 1× GNI yoki aktivlar; KIIP talab qilinmaydi., uz-cyrl: Корея университетининг асосий дастурида докторлик ва ариза бериш пайтида Корея компаниясида штат ходими сифатида ишлаш; даромад 1× GNI ёки активлар; KIIP талаб қилинмайди.}
    needs: {koreanEdu: 5}
    income: {gni: 1, assets: {route: true}}
  F-5-16:
    name: {en: Points-based permanent residence, ru: ПМЖ по баллам, uz: Ball tizimi bo‘yicha doimiy yashash, uz-cyrl: Балл тизими бўйича доимий яшаш}
    how: {en: "3+ years on a points-based F-2 (F-2-7, F-2-7S or F-2-T); your own income of 2× GNI (family income doesn't count) or net assets of 1.5× the national household average; KIIP level 5 or the PR integration test.", ru: '3+ года на F-2 по баллам (F-2-7, F-2-7S или F-2-T); собственный доход 2× ВНД (доход семьи не учитывается) или чистые активы 1,5× от среднего по стране на семью; KIIP 5 или интеграционный тест для ПМЖ.', uz: 'Ball tizimidagi F-2 da (F-2-7, F-2-7S yoki F-2-T) 3+ yil; shaxsiy daromad 2× GNI (oila daromadi hisobga olinmaydi) yoki sof aktivlar mamlakatdagi oilalar o‘rtachasidan 1,5×; KIIP 5 yoki doimiy yashash uchun integratsiya testi.', uz-cyrl: 'Балл тизимидаги F-2 да (F-2-7, F-2-7S ёки F-2-T) 3+ йил; шахсий даромад 2× GNI (оила даромади ҳисобга олинмайди) ёки соф активлар мамлакатдаги оилалар ўртачасидан 1,5×; KIIP 5 ёки доимий яшаш учун интеграция тести.'}
    lang: {kiip: 5}
    income: {gni: 2, assets: {average: 1.5}}
    needs: {stay: {years: 3, in: [F-2-7, F-2-7S, F-2-T]}}
  F-5-17:
    name: {en: Tourism/resort investor, ru: Инвестор в туризм/курорты, uz: Turizm/kurort investori, uz-cyrl: Туризм/курорт инвестори}
    how: {en: F-2-8 investment kept for 5 years., ru: Инвестиции F-2-8 сохраняются 5 лет., uz: F-2-8 investitsiyasi 5 yil saqlangan., uz-cyrl: F-2-8 инвестицияси 5 йил сақланган.}
    needs: {stay: {years: 5, in: [F-2-8]}}
  F-5-18:
    name: {en: Family of points-based PR, ru: Семья обладателя ПМЖ по баллам, uz: Ball tizimidagi doimiy yashovchi oilasi, uz-cyrl: Балл тизимидаги доимий яшовчи оиласи}
    how: {en: Spouse or minor child of an F-5-16 holder after 2+ years on F-2-71; household income of 1× GNI or assets; KIIP level 5 or the integration test (not for children under 15 or in Korean school)., ru: Супруг(а) или несовершеннолетний ребёнок обладателя F-5-16 после 2+ лет на F-2-71; доход семьи 1× ВНД или активы; KIIP 5 или интеграционный тест (не для детей до 15 лет и учащихся корейской школы)., uz: F-2-71 da 2+ yildan keyin F-5-16 egasining turmush o‘rtog‘i yoki voyaga yetmagan farzandi; oila daromadi 1× GNI yoki aktivlar; KIIP 5 yoki integratsiya testi (15 yoshgacha bo‘lgan bolalar va Koreya maktabida o‘qiyotganlar uchun emas)., uz-cyrl: F-2-71 да 2+ йилдан кейин F-5-16 эгасининг турмуш ўртоғи ёки вояга етмаган фарзанди; оила даромади 1× GNI ёки активлар; KIIP 5 ёки интеграция тести (15 ёшгача бўлган болалар ва Корея мактабида ўқиётганлар учун эмас).}
    lang: {kiip: 5}
    income: {gni: 1, household: true, assets: {route: true}}
  F-5-19:
    name: {en: Family of tourism/resort investor, ru: Семья инвестора в туризм, uz: Turizm investori oilasi, uz-cyrl: Туризм инвестори оиласи}
    how: {en: 'Spouse or unmarried child of the tourism/resort investor, granted together with the investor once the investment has been kept for 5 years; no income or KIIP test.', ru: 'Супруг(а) или не состоящий в браке ребёнок инвестора в туризм/курорты, получающие статус вместе с инвестором после 5 лет сохранения инвестиций; без требований к доходу и KIIP.', uz: 'Turizm/kurort investorining turmush o‘rtog‘i yoki turmush qurmagan farzandi, investitsiya 5 yil saqlangach investor bilan birga beriladi; daromad yoki KIIP talab qilinmaydi.', uz-cyrl: 'Туризм/курорт инвесторининг турмуш ўртоғи ёки турмуш қурмаган фарзанди, инвестиция 5 йил сақлангач инвестор билан бирга берилади; даромад ёки KIIP талаб қилинмайди.'}
  F-5-21:
    name: {en: Public-interest investor, ru: Инвестор в общественные проекты, uz: Jamoat loyihalari investori, uz-cyrl: Жамоат лойиҳалари инвестори}
    how: {en: F-2-12 investment kept for 5 years., ru: Инвестиции F-2-12 сохраняются 5 лет., uz: F-2-12 investitsiyasi 5 yil saqlangan., uz-cyrl: F-2-12 инвестицияси 5 йил сақланган.}
    needs: {stay: {years: 5, in: [F-2-12]}}
  F-5-22:
    name: {en: Family of public-interest investor, ru: Семья инвестора в общественные проекты, uz: Jamoat loyihalari investori oilasi, uz-cyrl: Жамоат лойиҳалари инвестори оиласи}
    how: {en: Spouse or unmarried child of an F-5-21 holder., ru: 'Супруг(а) или ребёнок обладателя F-5-21, не состоящий в браке.', uz: F-5-21 egasining turmush o‘rtog‘i yoki turmush qurmagan farzandi., uz-cyrl: F-5-21 эгасининг турмуш ўртоғи ёки турмуш қурмаган фарзанди.}
  F-5-24:
    name: {en: Tech start-up founder, ru: Основатель техностартапа, uz: Texnologik startap asoschisi, uz-cyrl: Технологик стартап асосчиси}
    how: {en: '3+ years on D-8-4, ₩300M+ of investment raised and 2+ Korean full-time employees.', ru: '3+ года на D-8-4, привлечено от ₩300 млн инвестиций и 2+ корейских штатных сотрудника.', uz: 'D-8-4 da 3+ yil, ₩300 mln+ investitsiya jalb qilingan va 2+ koreys shtat xodimi.', uz-cyrl: 'D-8-4 да 3+ йил, ₩300 млн+ инвестиция жалб қилинган ва 2+ корейс штат ходими.'}
    needs: {stay: {years: 3, in: [D-8-4]}}
  F-5-25:
    name: {en: Conditional large investor, ru: Условный крупный инвестор, uz: Shartli yirik investor, uz-cyrl: Шартли йирик инвестор}
    how: {en: '₩3bn deposited in a designated public fund with a pledge to keep it for 5 years (withdrawing it cancels the status); covers your spouse and unmarried children; no income test, KIIP or residence period.', ru: '₩3 млрд на счёте определённого общественного фонда с обязательством хранить 5 лет (при изъятии статус аннулируется); распространяется также на супруга(-у) и не состоящих в браке детей; без требований к доходу, KIIP и сроку проживания.', uz: 'Belgilangan jamoat fondiga 5 yil saqlash majburiyati bilan ₩3 mlrd qo‘yilgan (pul qaytarib olinsa, maqom bekor qilinadi); turmush o‘rtog‘ingiz va turmush qurmagan farzandlaringizga ham beriladi; daromad, KIIP yoki yashash muddati talab qilinmaydi.', uz-cyrl: 'Белгиланган жамоат фондига 5 йил сақлаш мажбурияти билан ₩3 млрд қўйилган (пул қайтариб олинса, мақом бекор қилинади); турмуш ўртоғингиз ва турмуш қурмаган фарзандларингизга ҳам берилади; даромад, KIIP ёки яшаш муддати талаб қилинмайди.'}
    needs: {invest: 6}
  F-5-26:
    name: {en: R&D staff at a foreign-invested firm, ru: Сотрудник R&D компании с иностранным капиталом, uz: Xorijiy investitsiyali kompaniyaning R&D xodimi, uz-cyrl: Хорижий инвестицияли компаниянинг R&D ходими}
    how: {en: 3+ years as essential R&D staff of a foreign-invested company (D-8-1) with a bachelor's degree; household income of 2× GNI or net assets of 1.5× the national household average., ru: '3+ года ключевым сотрудником R&D компании с иностранными инвестициями (D-8-1) с дипломом бакалавра; доход семьи 2× ВНД или чистые активы семьи 1,5× от среднего по стране.', uz: 'Bakalavr diplomi bilan xorijiy investitsiyali kompaniyada (D-8-1) asosiy R&D xodimi sifatida 3+ yil; oila daromadi 2× GNI yoki oilaning sof aktivlari mamlakat o‘rtachasidan 1,5×.', uz-cyrl: 'Бакалавр дипломи билан хорижий инвестицияли компанияда (D-8-1) асосий R&D ходими сифатида 3+ йил; оила даромади 2× GNI ёки оиланинг соф активлари мамлакат ўртачасидан 1,5×.'}
    income: {gni: 2, household: true, assets: {average: 1.5}}
    needs: {edu: 3, stay: {years: 3, in: [D-8-1]}}
  F-5-27:
    name: {en: Recognised refugee, ru: Признанный беженец, uz: Tan olingan qochqin, uz-cyrl: Тан олинган қочқин}
    how: {en: 2+ years as a recognised refugee (F-2-4); household income of 1× GNI or household assets at the national median; KIIP level 5 or the integration test., ru: 2+ года в статусе признанного беженца (F-2-4); доход семьи 1× ВНД или активы семьи на уровне медианы по стране; KIIP 5 или интеграционный тест., uz: Tan olingan qochqin (F-2-4) sifatida 2+ yil; oila daromadi 1× GNI yoki oila aktivlari mamlakat medianasi darajasida; KIIP 5 yoki integratsiya testi., uz-cyrl: Тан олинган қочқин (F-2-4) сифатида 2+ йил; оила даромади 1× GNI ёки оила активлари мамлакат медианаси даражасида; KIIP 5 ёки интеграция тести.}
    income: {gni: 1, household: true, assets: {median: true}}
    needs: {stay: {years: 2, in: [F-2-4]}}
    lang: {kiip: 5}
  F-5-28:
    name: {en: Special contributor, ru: Особый вклад, uz: Alohida hissa qo‘shgan shaxs, uz-cyrl: Алоҳида ҳисса қўшган шахс}
    how: {en: 2+ years on F-2-16; household income of 1× GNI or assets; KIIP level 5 or the integration test., ru: 2+ года на F-2-16; доход семьи 1× ВНД или активы; KIIP 5 или интеграционный тест., uz: F-2-16 da 2+ yil; oila daromadi 1× GNI yoki aktivlar; KIIP 5 yoki integratsiya testi., uz-cyrl: F-2-16 да 2+ йил; оила даромади 1× GNI ёки активлар; KIIP 5 ёки интеграция тести.}
    lang: {kiip: 5}
    income: {gni: 1, household: true, assets: {route: true}}
    needs: {stay: {years: 2, in: [F-2-16]}}
  F-5-29:
    name: {en: Family of special contributor, ru: Семья лица с особым вкладом, uz: Alohida hissa qo‘shgan shaxs oilasi, uz-cyrl: Алоҳида ҳисса қўшган шахс оиласи}
    how: {en: Spouse or minor child of an F-5-28 holder; household income of 1× GNI or assets; KIIP level 5 or the integration test (not for children under 15 or in Korean school)., ru: Супруг(а) или несовершеннолетний ребёнок обладателя F-5-28; доход семьи 1× ВНД или активы; KIIP 5 или интеграционный тест (не требуется для детей до 15 лет или учащихся корейской школы)., uz: F-5-28 egasining turmush o‘rtog‘i yoki voyaga yetmagan farzandi; oila daromadi 1× GNI yoki aktivlar; KIIP 5 yoki integratsiya testi (15 yoshgacha yoki Koreya maktabida o‘qiyotgan bolalar uchun talab qilinmaydi)., uz-cyrl: F-5-28 эгасининг турмуш ўртоғи ёки вояга етмаган фарзанди; оила даромади 1× GNI ёки активлар; KIIP 5 ёки интеграция тести (15 ёшгача ёки Корея мактабида ўқиётган болалар учун талаб қилинмайди).}
    income: {gni: 1, household: true, assets: {route: true}}
    lang: {kiip: 5}
  F-5-S1:
    name: {en: K-STAR permanent residence, ru: ПМЖ K-STAR, uz: K-STAR doimiy yashash, uz-cyrl: K-STAR доимий яшаш}
    how: {en: 3+ years on F-2-7S or F-2-7 as a K-STAR graduate and 90/200 K-STAR points., ru: 3+ года на F-2-7S или F-2-7 как выпускник K-STAR и 90/200 баллов K-STAR., uz: K-STAR bitiruvchisi sifatida F-2-7S yoki F-2-7 da 3+ yil va 90/200 K-STAR ball., uz-cyrl: K-STAR битирувчиси сифатида F-2-7S ёки F-2-7 да 3+ йил ва 90/200 K-STAR балл.}
    needs: {stay: {years: 3, in: [F-2-7S, F-2-7]}}
  F-5-S2:
    name: {en: K-STAR family, ru: Семья K-STAR, uz: K-STAR oilasi, uz-cyrl: K-STAR оиласи}
    how: {en: Spouse or minor child of an F-5-S1 holder after 2+ years on F-2-71; household income of 1× GNI or assets; KIIP level 5 or the integration test (not for children under 15 or in Korean school)., ru: Супруг(а) или несовершеннолетний ребёнок обладателя F-5-S1 после 2+ лет на F-2-71; доход семьи 1× ВНД или активы; KIIP 5 или интеграционный тест (не требуется для детей до 15 лет или учащихся корейской школы)., uz: F-2-71 da 2+ yildan keyin F-5-S1 egasining turmush o‘rtog‘i yoki voyaga yetmagan farzandi; oila daromadi 1× GNI yoki aktivlar; KIIP 5 yoki integratsiya testi (15 yoshgacha yoki Koreya maktabida o‘qiyotgan bolalar uchun talab qilinmaydi)., uz-cyrl: F-2-71 да 2+ йилдан кейин F-5-S1 эгасининг турмуш ўртоғи ёки вояга етмаган фарзанди; оила даромади 1× GNI ёки активлар; KIIP 5 ёки интеграция тести (15 ёшгача ёки Корея мактабида ўқиётган болалар учун талаб қилинмайди).}
    income: {gni: 1, household: true, assets: {route: true}}
    needs: {stay: {years: 2, in: [F-2-71]}}
    lang: {kiip: 5}
  F-5-T:
    name: {en: Top-Tier permanent residence, ru: ПМЖ Top-Tier, uz: Top-Tier doimiy yashash, uz-cyrl: Top-Tier доимий яшаш}
    how: {en: 3+ years on F-2-T in a high-tech or science field; your own income of 3× GNI; KIIP level 3 or TOPIK 3., ru: 3+ года на F-2-T в hi-tech или науке; собственный доход 3× ВНД; KIIP 3 или TOPIK 3., uz: Yuqori texnologiyalar yoki fan sohasida F-2-T da 3+ yil; shaxsiy daromad 3× GNI; KIIP 3 yoki TOPIK 3., uz-cyrl: Юқори технологиялар ёки фан соҳасида F-2-T да 3+ йил; шахсий даромад 3× GNI; KIIP 3 ёки TOPIK 3.}
    lang: {topik: 3, kiip: 3}
    income: {gni: 3}
    needs: {stay: {years: 3, in: [F-2-T]}}
  F-5-T1:
    name: {en: Top-Tier family, ru: Семья Top-Tier, uz: Top-Tier oilasi, uz-cyrl: Top-Tier оиласи}
    how: {en: 'Spouse or minor child of a Top-Tier holder: permanent residence after 3 years on F-2-T1; no income or KIIP test.', ru: 'Супруг(а) или несовершеннолетний ребёнок обладателя статуса Top-Tier: ПМЖ после 3 лет на F-2-T1; без требований к доходу и KIIP.', uz: 'Top-Tier maqomi egasining turmush o‘rtog‘i yoki voyaga yetmagan farzandi: F-2-T1 da 3 yildan keyin doimiy yashash maqomi; daromad va KIIP talab qilinmaydi.', uz-cyrl: 'Top-Tier мақоми эгасининг турмуш ўртоғи ёки вояга етмаган фарзанди: F-2-T1 да 3 йилдан кейин доимий яшаш мақоми; даромад ва KIIP талаб қилинмайди.'}
  NONE:
    name: {en: Outside Korea, ru: За пределами Кореи, uz: Koreyadan tashqarida, uz-cyrl: Кореядан ташқарида}
    how: {en: 'No Korean visa yet: your first visa is issued by a Korean consulate or online.', ru: 'Корейской визы пока нет: первую визу выдаёт консульство Кореи или онлайн-сервис.', uz: 'Hali Koreya vizasi yo‘q: birinchi vizani Koreya konsulligi yoki onlayn xizmat beradi.', uz-cyrl: 'Ҳали Корея визаси йўқ: биринчи визани Корея консуллиги ёки онлайн хизмат беради.'}
