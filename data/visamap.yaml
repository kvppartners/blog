    - to: F-3
      abroad: true
      note: {en: 'Spouse or minor child of a D, E or F-2 status holder. From a short-term stay you need a new visa from abroad; a change in Korea is allowed only on humanitarian grounds such as pregnancy, birth, child-raising or illness.', ru: 'Супруг(а) или несовершеннолетний ребёнок обладателя статуса D, E или F-2. При краткосрочном пребывании нужна новая виза из-за рубежа; смена статуса в Корее допускается только по гуманитарным причинам, таким как беременность, роды, воспитание ребёнка или болезнь.', uz: 'D, E yoki F-2 maqomi egasining turmush o‘rtog‘i yoki voyaga yetmagan farzandi. Qisqa muddatli maqomdan chet eldan yangi viza kerak; Koreyada maqomni o‘zgartirish faqat homiladorlik, tug‘ruq, farzand tarbiyalash yoki kasallik kabi insonparvarlik sabablari bilan mumkin.', uz-cyrl: 'D, E ёки F-2 мақоми эгасининг турмуш ўртоғи ёки вояга етмаган фарзанди. Қисқа муддатли мақомдан чет элдан янги виза керак; Кореяда мақомни ўзгартириш фақат ҳомиладорлик, туғруқ, фарзанд тарбиялаш ёки касаллик каби инсонпарварлик сабаблари билан мумкин.'}
    countries: visaWaiver
    notes:
    - countries: [KZ]
      text: {en: 'Kazakh citizens: up to 30 days per visit and 60 days in any 180; a K-ETA is needed.', ru: 'Граждане Казахстана: до 30 дней за въезд и 60 дней за любые 180; нужна K-ETA.', uz: 'Qozog‘iston fuqarolari: har safar 30 kungacha va har 180 kunda 60 kungacha; K-ETA kerak.', uz-cyrl: 'Қозоғистон фуқаролари: ҳар сафар 30 кунгача ва ҳар 180 кунда 60 кунгача; K-ETA керак.'}
    - countries: [RU]
      text: {en: 'Russian citizens: up to 60 days per visit and 90 days in any 180, with no study or work; a K-ETA is needed.', ru: 'Граждане России: до 60 дней за въезд и 90 дней за любые 180, без учёбы и работы; нужна K-ETA.', uz: 'Rossiya fuqarolari: har safar 60 kungacha va har 180 kunda 90 kungacha, o‘qish va ishlashsiz; K-ETA kerak.', uz-cyrl: 'Россия фуқаролари: ҳар сафар 60 кунгача ва ҳар 180 кунда 90 кунгача, ўқиш ва ишлашсиз; K-ETA керак.'}
    - countries: [DE]
      text: {en: 'German citizens who entered visa-free: a change inside Korea is possible to any long-term status except D-3, E-9 and H-1.', ru: 'Граждане Германии, въехавшие без визы: сменить статус в Корее можно на любой долгосрочный, кроме D-3, E-9 и H-1.', uz: 'Vizasiz kirgan Germaniya fuqarolari: Koreya ichida D-3, E-9 va H-1 dan tashqari istalgan uzoq muddatli maqomga o‘tish mumkin.', uz-cyrl: 'Визасиз кирган Германия фуқаролари: Корея ичида D-3, E-9 ва H-1 дан ташқари исталган узоқ муддатли мақомга ўтиш мумкин.'}
  B-2:
    name: {en: Visa-free tourism / transit, ru: Безвизовый туризм / транзит, uz: Vizasiz turizm / tranzit, uz-cyrl: Визасиз туризм / транзит}
    how: {en: 'Visa-free entry for tourism or transit, 30–90 days (6 months for Canadians); most visitors need a K-ETA. Changing status inside Korea is generally not possible.', ru: Безвизовый въезд для туризма или транзита на 30–90 дней (для граждан Канады — 6 месяцев); большинству нужна K-ETA. Сменить статус в Корее обычно нельзя., uz: Turizm yoki tranzit uchun 30–90 kunga vizasiz kirish (Kanada fuqarolari uchun 6 oy); ko‘pchilikka K-ETA kerak. Koreya ichida maqomni o‘zgartirish odatda mumkin emas., uz-cyrl: Туризм ёки транзит учун 30–90 кунга визасиз кириш (Канада фуқаролари учун 6 ой); кўпчиликка K-ETA керак. Корея ичида мақомни ўзгартириш одатда мумкин эмас.}
