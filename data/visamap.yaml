# Visa map data: visa types, the moves between them, and who they are open to.
# Generated from research of the Korea Immigration Service manuals (2026.9), the
# Immigration Act decree tables, MOJ notices and embassy guidance; see the Visa map
# page for sources. Each visa has a name and a 'how to get it' note per language.
#   next:        possible next visas; 'abroad: true' = apply for a new visa from abroad;
#                'abroadFor: <group>' = from abroad only for that group's nationalities
#   age:         [min] or [min, max];  ageByCountry: per-nationality age limits
#   countries:   nationalities allowed (a group name from 'groups' or a list of ISO codes)
#   notes:       extra notes for specific nationalities ('abroad: true' = only when applying from abroad)
#   needs:       who can get it, from the reader's optional details: {fact: value} (all must hold)
#                or a list of those (any one is enough); a move's own 'needs' replaces the visa's.
#                Facts: korean (true = ethnic Korean); spouse (none, korean, f5, foreigner, abroad,
#                exKorean); koreanChild (true); parent (none, korean, f5, foreigner; under 19 only);
#                edu / koreanEdu (minimum level: 1 high school, 2 college, 3 bachelor, 4 master,
#                5 doctorate; koreanEdu = from a Korean school); stem (true); rank (minimum QS
#                ranking of the university: 1 = top 500, 2 = top 200, 3 = top 100);
#                experience (minimum years); invest (minimum level: 1 = ₩100M, 2 = ₩300M,
#                3 = ₩700M ≈ US$500K, 4 = ₩1B, 5 = ₩1.5B, 6 = ₩3B); ageUnder (age below N);
#                countries (a group name or list of ISO codes); notAfter (visas that may not come
#                right before the visa this move leaves from, e.g. [D-4, E-9]); stay ({years: N,
#                in: <status group or list>}: N years on those visas along the path, e.g. 5 years
#                on D-7 to E-7 or F-2 for F-5-1).
#                Years of work ('experience') and years on visas ('stay') grow along the path: a
#                reader who falls short of them sees the option as "not yet", not as closed.
#   again:       on a move, the note to show instead when the reader held that visa before
#   gives:       facts the visa implies for later steps (e.g. D-2-2 gives a Korean bachelor's)
#   lang:        Korean level needed: {topik: N, kiip: N, koreanEdu: N} (any one is enough;
#                koreanEdu = a Korean school or university diploma); a lower level the reader
#                gave marks the option "not yet", it never closes it
#   years:       [shortest, longest] years the visa can be held before moving on; none = no
#                fixed length (it can be extended). Used for the reader's age along the path and
#                for 'stay'.  work: true = time on the visa counts as work experience.
#   income:      yearly income the visa asks for: {gni: N} (N × GNI per person, see 'gni') or
#                {krw: N} (₩N million); household: true = family living with the reader counts
#                too (ownHalf: true = at least half must be the reader's own; ownShareWaived:
#                conditions that lift that); sponsor: true = the inviting person's income, shown
#                but never compared with the reader's; cuts: reductions from 'incomeCuts';
#                floor: lowest share of the base; assets: the asset route instead of income
#                ({average: N} × the average household net assets in 'netAssets', own: true =
#                the reader's own; median: true; route: true = assets count, amount not set).
#                A move's own 'income' replaces the visa's (e.g. 2× GNI for Top-Tier as a change).
#   NONE:        the starting point for readers without a Korean visa; its moves are first visas
# Top level: gni (the GNI per person immigration applies, ₩ million: the Bank of Korea's first
# figure for the previous year, from April to the next March); netAssets (average household
# net assets of the national household survey, ₩ million); incomeCuts (reductions of an income
# requirement: factor = share of the base that remains, when = the conditions, as 'needs'
# plus kiip, topik and ageFrom; no 'when' = the map can't tell, so it is shown as possible;
# reductions don't add up, the smallest share that applies counts); statusGroups (visa lists
# for 'stay'); startOnly (visas the map never offers as a next step on purpose: closed to new
# applicants or granted only by a decision, so readers can only start from them).
