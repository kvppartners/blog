# Visa map data: visa types, the moves between them, and who they are open to.
# Generated from research of the Korea Immigration Service manuals (2026.9), the
# Immigration Act decree tables, MOJ notices and embassy guidance; see the Visa map
# page for sources. Each visa has a name and a 'how to get it' note per language.
#   next:        possible next visas; 'abroad: true' = apply for a new visa from abroad;
#                'abroadFor: <group>' = from abroad only for that group's nationalities
#   age:         [min] or [min, max];  ageByCountry: per-nationality age limits
#   countries:   nationalities allowed (a group name from 'groups' or a list of ISO codes)
#   notes:       extra notes for specific nationalities ('abroad: true' = only when applying from abroad)
#   needs:       who can get it, from the reader's optional details: {fact: value} (all must hold)
#                or a list of those (any one is enough); a move's own 'needs' replaces the visa's.
#                Facts: korean (true = ethnic Korean); spouse (none, korean, f5, foreigner, abroad,
#                exKorean); koreanChild (true); parent (none, korean, f5, foreigner; under 19 only);
#                edu / koreanEdu (minimum level: 1 high school, 2 college, 3 bachelor, 4 master,
#                5 doctorate; koreanEdu = from a Korean school); stem (true); rank (minimum QS
#                ranking of the university: 1 = top 500, 2 = top 200, 3 = top 100);
#                experience (minimum years); invest (minimum level: 1 = ₩100M, 2 = ₩300M,
#                3 = ₩700M ≈ US$500K, 4 = ₩1B, 5 = ₩1.5B, 6 = ₩3B); ageUnder (age below N);
#                countries (a group name or list of ISO codes); notAfter (visas that may not come
#                right before the visa this move leaves from, e.g. [D-4, E-9])
#   again:       on a move, the note to show instead when the reader held that visa before
#   gives:       facts the visa implies for later steps (e.g. D-2-2 gives a Korean bachelor's)
#   lang:        Korean level needed: {topik: N, kiip: N} (either is enough); a hint, never blocks
#   NONE:        the starting point for readers without a Korean visa; its moves are first visas
