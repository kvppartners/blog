    how: {en: 'Pass EPS-TOPIK and get hired through the Employment Permit System; age 18–39, citizens of 18 partner countries. Re-entry special case: after 4 years 10 months without changing workplace (or only for the allowed reasons), and if your employer applies before you leave, you can come back once on a new E-9 one month after leaving, for up to another 4 years 10 months.', ru: 'Сдать EPS-TOPIK и трудоустроиться по системе разрешений на работу; возраст 18–39, граждане 18 стран-партнёров. Особый порядок повторного въезда: если вы отработали 4 года 10 месяцев без смены места работы (или меняли его только по допустимым причинам) и работодатель подал заявку до вашего выезда, через месяц после выезда можно один раз вернуться по новой визе E-9 ещё на срок до 4 лет 10 месяцев.', uz: 'EPS-TOPIK imtihonidan o‘tib, ish ruxsatnomasi tizimi orqali ishga joylashish; yosh 18–39, 18 hamkor davlat fuqarolari. Qayta kirish bo‘yicha alohida tartib: 4 yil 10 oy ish joyini o‘zgartirmasdan (yoki faqat ruxsat etilgan sabablar bilan) ishlagan bo‘lsangiz va ish beruvchi siz ketishdan oldin ariza bersa, ketganingizdan bir oy o‘tib yangi E-9 bilan yana 4 yil 10 oygacha bir marta qaytishingiz mumkin.', uz-cyrl: 'EPS-TOPIK имтиҳонидан ўтиб, иш рухсатномаси тизими орқали ишга жойлашиш; ёш 18–39, 18 ҳамкор давлат фуқаролари. Қайта кириш бўйича алоҳида тартиб: 4 йил 10 ой иш жойини ўзгартирмасдан (ёки фақат рухсат этилган сабаблар билан) ишлаган бўлсангиз ва иш берувчи сиз кетишдан олдин ариза берса, кетганингиздан бир ой ўтиб янги E-9 билан яна 4 йил 10 ойгача бир марта қайтишингиз мумкин.'}
