      note: {en: 'Spouse or minor child of an F-5 holder, whose household earns at least 1× GNI (70% for up to 3 people). A minor child applies with a visa confirmation (CCVI) that the F-5 parent requests in Korea.', ru: 'Супруг(а) или несовершеннолетний ребёнок обладателя F-5, чья семья зарабатывает не менее 1× ВНД (70% для семьи до 3 человек). Несовершеннолетний ребёнок подаёт документы с подтверждением визы (CCVI), которое родитель с F-5 оформляет в Корее.', uz: F-5 egasining turmush o‘rtog‘i yoki voyaga yetmagan farzandi; oilaning daromadi kamida 1× GNI (3 kishigacha bo‘lgan oila uchun 70%). Voyaga yetmagan farzand F-5 egasi bo‘lgan ota yoki onasi Koreyada rasmiylashtirgan viza tasdig‘i (CCVI) bilan topshiradi., uz-cyrl: F-5 эгасининг турмуш ўртоғи ёки вояга етмаган фарзанди; оиланинг даромади камида 1× GNI (3 кишигача бўлган оила учун 70%). Вояга етмаган фарзанд F-5 эгаси бўлган ота ёки онаси Кореяда расмийлаштирган виза тасдиғи (CCVI) билан топширади.}
    - F-3
    - to: F-1
      note: {en: 'Only in specific cases: e.g. a parent of a foreign student, a highly skilled professional or an investor, a family member of a marriage migrant who comes to help with childcare, or the digital-nomad visa (F-1-D) for remote workers with a high foreign income. Issued by a Korean consulate, usually on a visa confirmation (CCVI).', ru: 'Только в отдельных случаях: например, родитель иностранного студента, высококвалифицированного специалиста или инвестора, член семьи брачного мигранта, приезжающий помочь с уходом за детьми, или виза цифрового кочевника (F-1-D) для удалённых работников с высоким зарубежным доходом. Выдаётся консульством Кореи, обычно по подтверждению визы (CCVI).', uz: 'Faqat ayrim hollarda: masalan, xorijlik talaba, yuqori malakali mutaxassis yoki investorning ota-onasi, farzand tarbiyasiga yordam berish uchun keladigan nikoh migrantining oila a’zosi yoki chet eldan yuqori daromadga ega masofaviy ishlovchilar uchun raqamli nomad vizasi (F-1-D). Koreya konsulligi beradi, odatda viza tasdig‘i (CCVI) asosida.', uz-cyrl: 'Фақат айрим ҳолларда: масалан, хорижлик талаба, юқори малакали мутахассис ёки инвесторнинг ота-онаси, фарзанд тарбиясига ёрдам бериш учун келадиган никоҳ мигрантининг оила аъзоси ёки чет элдан юқори даромадга эга масофавий ишловчилар учун рақамли номад визаси (F-1-D). Корея консуллиги беради, одатда виза тасдиғи (CCVI) асосида.'}
