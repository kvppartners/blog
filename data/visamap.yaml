  F-2-99:
    name: {en: Long-term resident, ru: Долгосрочный резидент, uz: Uzoq muddatli rezident, uz-cyrl: Узоқ муддатли резидент}
    how: {en: "5+ years in a row on D-1, D-5 to D-9, E-1 to E-5, E-6-1, E-6-3, E-7 or F-1 (E-9 and student years don't count); your own income of ₩40M+ last year and ₩20M+ of your own financial assets held for 6+ months; KIIP level 4 or a Korean school or university diploma.", ru: '5+ лет подряд в статусах D-1, с D-5 по D-9, с E-1 по E-5, E-6-1, E-6-3, E-7 или F-1 (годы на E-9 и годы учёбы не засчитываются); собственный доход от ₩40 млн за прошлый год и собственные финансовые активы от ₩20 млн, хранящиеся 6+ месяцев; KIIP 4 или диплом корейской школы или вуза.', uz: 'D-1, D-5 dan D-9 gacha, E-1 dan E-5 gacha, E-6-1, E-6-3, E-7 yoki F-1 da ketma-ket 5+ yil (E-9 va o‘qish yillari hisobga olinmaydi); o‘tgan yilgi shaxsiy daromad ₩40 mln+ va 6+ oy davomida saqlangan ₩20 mln+ shaxsiy moliyaviy aktivlar; KIIP 4 yoki Koreya maktabi yoxud universiteti diplomi.', uz-cyrl: 'D-1, D-5 дан D-9 гача, E-1 дан E-5 гача, E-6-1, E-6-3, E-7 ёки F-1 да кетма-кет 5+ йил (E-9 ва ўқиш йиллари ҳисобга олинмайди); ўтган йилги шахсий даромад ₩40 млн+ ва 6+ ой давомида сақланган ₩20 млн+ шахсий молиявий активлар; KIIP 4 ёки Корея мактаби ёхуд университети дипломи.'}
    income: {krw: 40}
    needs: {stay: {years: 5, in: longTerm}}
    work: true
    next:
    - to: F-5-1
      note: {en: 'After 5+ years in work or business statuses (D-7–E-7, F-2), with the income and KIIP 5 requirements.', ru: 'После 5+ лет в рабочих или бизнес-статусах (D-7–E-7, F-2), при выполнении требований к доходу и KIIP 5.', uz: 'Ish yoki biznes maqomlarida (D-7–E-7, F-2) 5+ yildan keyin, daromad va KIIP 5 talablari bilan.', uz-cyrl: 'Иш ёки бизнес мақомларида (D-7–E-7, F-2) 5+ йилдан кейин, даромад ва KIIP 5 талаблари билан.'}
    - to: F-5-9
      note: {en: 'If you hold a foreign doctorate in a high-tech field: after 1+ year at a Korean company in that field.', ru: 'При иностранной докторской степени в высокотехнологичной области: после 1+ года работы в этой области в корейской компании.', uz: 'Yuqori texnologiyalar sohasida xorijiy doktorlik darajasi bo‘lsa: shu sohada Koreya kompaniyasida 1+ yil ishlagandan keyin.', uz-cyrl: 'Юқори технологиялар соҳасида хорижий докторлик даражаси бўлса: шу соҳада Корея компаниясида 1+ йил ишлагандан кейин.'}
    - F-5-10
    - to: F-5-15
      note: {en: 'If you earned a doctorate at a Korean university: after 1+ year of full-time work at a Korean company.', ru: 'Если вы получили докторскую степень в корейском вузе: после 1+ года работы на полную ставку в корейской компании.', uz: 'Koreya universitetida doktorlik darajasini olgan bo‘lsangiz: Koreya kompaniyasida 1+ yil to‘liq ishlagandan keyin.', uz-cyrl: 'Корея университетида докторлик даражасини олган бўлсангиз: Корея компаниясида 1+ йил тўлиқ ишлагандан кейин.'}
    - F-5-13
    - F-2-R
    - F-6-1
    lang: {kiip: 4, koreanEdu: 1}
  F-2-R:
    name: {en: Regional talent, ru: Региональный специалист, uz: Hududiy mutaxassis, uz-cyrl: Ҳудудий мутахассис}
    how: {en: "Local-government recommendation; a Korean associate degree or higher, or your own income of at least the recommending region's living wage; KIIP 3 or TOPIK 3; and a commitment to live, work or run a business in that depopulating area for 5 years.", ru: 'Рекомендация местных властей; корейский диплом колледжа или выше либо собственный доход не ниже прожиточного уровня оплаты труда в рекомендующем регионе; KIIP 3 или TOPIK 3; и обязательство жить, работать или вести бизнес в этом депопулирующем районе 5 лет.', uz: 'Mahalliy hokimiyat tavsiyasi; Koreya kolleji diplomi yoki undan yuqori daraja yoxud tavsiya bergan hududdagi yashash uchun zarur ish haqi darajasidan kam bo‘lmagan shaxsiy daromad; KIIP 3 yoki TOPIK 3; va o‘sha aholisi kamayayotgan hududda 5 yil yashash, ishlash yoki biznes yuritish majburiyati.', uz-cyrl: 'Маҳаллий ҳокимият тавсияси; Корея коллежи дипломи ёки ундан юқори даража ёхуд тавсия берган ҳудуддаги яшаш учун зарур иш ҳақи даражасидан кам бўлмаган шахсий даромад; KIIP 3 ёки TOPIK 3; ва ўша аҳолиси камаяётган ҳудудда 5 йил яшаш, ишлаш ёки бизнес юритиш мажбурияти.'}
    work: true
    next:
    - to: F-5-1
      note: {en: 'No dedicated route: F-2 years count toward F-5-1 (5 years, income, KIIP 5). Confirm with immigration (1345).', ru: 'Отдельного пути нет: годы на F-2 засчитываются для F-5-1 (5 лет, доход, KIIP 5). Уточните в иммиграционной службе (1345).', uz: 'Alohida yo‘l yo‘q: F-2 dagi yillar F-5-1 uchun hisoblanadi (5 yil, daromad, KIIP 5). Immigratsiya xizmatidan aniqlang (1345).', uz-cyrl: 'Алоҳида йўл йўқ: F-2 даги йиллар F-5-1 учун ҳисобланади (5 йил, даромад, KIIP 5). Иммиграция хизматидан аниқланг (1345).'}
    - F-5-10
    - F-6-1
    lang: {topik: 3, kiip: 3}
  F-2-T:
    name: {en: Top-Tier resident, ru: Резидент Top-Tier, uz: Top-Tier rezidenti, uz-cyrl: Top-Tier резиденти}
    how: {en: "World-class talent: a master's or PhD from a world top-100 university plus 8+ years of experience (3+ at a global top-500 company) or 5+ years of post-doctoral research; income of 3× GNI (4× GNI if you miss the degree or the career criterion); a ministry recommendation; KIIP 1 or TOPIK 1. As a change in Korea after 1+ year in a high-tech job: 2× GNI.", ru: 'Специалист мирового уровня: магистратура или PhD в вузе из мирового топ-100 и 8+ лет опыта (из них 3+ года в компании из мирового топ-500) или 5+ лет постдокторских исследований; доход 3× ВНД (4× ВНД, если не выполнен критерий по степени или по опыту работы); рекомендация министерства; KIIP 1 или TOPIK 1. При смене статуса в Корее после 1+ года работы в hi-tech: 2× ВНД.', uz: 'Jahon darajasidagi mutaxassis: jahon top-100 universitetida magistr yoki PhD va 8+ yil tajriba (shundan 3+ yil jahon top-500 kompaniyasida) yoki 5+ yil postdoktorlik tadqiqoti; daromad 3× GNI (daraja yoki ish tajribasi mezoniga javob bermasangiz, 4× GNI); vazirlik tavsiyasi; KIIP 1 yoki TOPIK 1. Koreyada yuqori texnologiyalar sohasida 1+ yil ishlagandan keyin maqomni o‘zgartirganda: 2× GNI.', uz-cyrl: 'Жаҳон даражасидаги мутахассис: жаҳон top-100 университетида магистр ёки PhD ва 8+ йил тажриба (шундан 3+ йил жаҳон top-500 компаниясида) ёки 5+ йил постдокторлик тадқиқоти; даромад 3× GNI (даража ёки иш тажрибаси мезонига жавоб бермасангиз, 4× GNI); вазирлик тавсияси; KIIP 1 ёки TOPIK 1. Кореяда юқори технологиялар соҳасида 1+ йил ишлагандан кейин мақомни ўзгартирганда: 2× GNI.'}
    needs:
    - {edu: 4, rank: 3}
    - {experience: 8}
    - {edu: 5, experience: 5}
    income: {gni: 3}
    lang: {kiip: 1, topik: 1}
    work: true
    next:
    - F-5-T
    - F-5-16
    - to: F-5-1
      note: {en: 'After 5+ years in work or business statuses (D-7–E-7, F-2), with the income and KIIP 5 requirements.', ru: 'После 5+ лет в рабочих или бизнес-статусах (D-7–E-7, F-2), при выполнении требований к доходу и KIIP 5.', uz: 'Ish yoki biznes maqomlarida (D-7–E-7, F-2) 5+ yildan keyin, daromad va KIIP 5 talablari bilan.', uz-cyrl: 'Иш ёки бизнес мақомларида (D-7–E-7, F-2) 5+ йилдан кейин, даромад ва KIIP 5 талаблари билан.'}
    - F-2-R
  F-2-T1:
    name: {en: Top-Tier family, ru: Семья Top-Tier, uz: Top-Tier oilasi, uz-cyrl: Top-Tier оиласи}
    how: {en: Spouse or minor child of an F-2-T holder., ru: Супруг(а) или несовершеннолетний ребёнок обладателя F-2-T., uz: F-2-T egasining turmush o‘rtog‘i yoki voyaga yetmagan farzandi., uz-cyrl: F-2-T эгасининг турмуш ўртоғи ёки вояга етмаган фарзанди.}
    next:
    - F-5-T1
    - to: F-5-1
      note: {en: 'After 5+ years in work or business statuses (D-7–E-7, F-2), with the income and KIIP 5 requirements.', ru: 'После 5+ лет в рабочих или бизнес-статусах (D-7–E-7, F-2), при выполнении требований к доходу и KIIP 5.', uz: 'Ish yoki biznes maqomlarida (D-7–E-7, F-2) 5+ yildan keyin, daromad va KIIP 5 talablari bilan.', uz-cyrl: 'Иш ёки бизнес мақомларида (D-7–E-7, F-2) 5+ йилдан кейин, даромад ва KIIP 5 талаблари билан.'}
    needs: *id002
  F-1:
    name: {en: Family visitor, ru: Визит к семье, uz: Oilaviy tashrif, uz-cyrl: Оилавий ташриф}
    how: {en: Visiting or living with family members in Korea in various cases; generally no work., ru: 'Посещение или проживание с семьёй в Корее в разных случаях; как правило, без работы.', uz: Turli holatlarda Koreyadagi oila a’zolarini ziyorat qilish yoki ular bilan yashash; odatda ishlash mumkin emas., uz-cyrl: Турли ҳолатларда Кореядаги оила аъзоларини зиёрат қилиш ёки улар билан яшаш; одатда ишлаш мумкин эмас.}
    next:
    - to: F-2-2
      note: {en: 'For a minor foreign child of a Korean citizen, or a person of any age born of a marriage (incl. de facto) with a Korean citizen.', ru: 'Для несовершеннолетнего ребёнка-иностранца гражданина Кореи или человека любого возраста, рождённого в браке (в том числе фактическом) с гражданином Кореи.', uz: Koreya fuqarosining voyaga yetmagan chet ellik farzandi yoki Koreya fuqarosi bilan nikohdan (shu jumladan rasmiylashtirilmagan nikohdan) tug‘ilgan har qanday yoshdagi shaxs uchun., uz-cyrl: Корея фуқаросининг вояга етмаган чет эллик фарзанди ёки Корея фуқароси билан никоҳдан (шу жумладан расмийлаштирилмаган никоҳдан) туғилган ҳар қандай ёшдаги шахс учун.}
    - to: F-2-71
      note: {en: Once the F-2-7 family member earns at least 1× GNI., ru: Когда член семьи с F-2-7 зарабатывает не менее 1× ВНД., uz: F-2-7 dagi oila a’zosi kamida 1× GNI ishlaganda., uz-cyrl: F-2-7 даги оила аъзоси камида 1× GNI ишлаганда.}
    - to: F-2-99
      needs: {countries: [TW], stay: {years: 5, in: longTerm}}
      note: {en: 'Only for Taiwanese nationals born in Korea (hwagyo): after 5+ years of continuous stay with your life base in Korea; KIIP is not required. Other F-1 holders cannot change to F-2-99.', ru: 'Только для граждан Тайваня, родившихся в Корее (хуацяо): после 5+ лет непрерывного пребывания, если центр вашей жизни — в Корее; KIIP не нужен. Другие обладатели F-1 не могут перейти на F-2-99.', uz: 'Faqat Koreyada tug‘ilgan Tayvan fuqarolari (xuatsyao) uchun: hayotingiz markazi Koreyada bo‘lib, 5+ yil uzluksiz yashagandan keyin; KIIP talab qilinmaydi. Boshqa F-1 egalari F-2-99 ga o‘ta olmaydi.', uz-cyrl: 'Фақат Кореяда туғилган Тайван фуқаролари (хуацяо) учун: ҳаётингиз маркази Кореяда бўлиб, 5+ йил узлуксиз яшагандан кейин; KIIP талаб қилинмайди. Бошқа F-1 эгалари F-2-99 га ўта олмайди.'}
    - E-7-Y
    - F-6-1
    - F-6-2
    - D-2-2
    - F-5-13
    - F-2-3
    - F-3
  F-3:
    name: {en: Dependent family, ru: Член семьи, uz: Oila a’zosi, uz-cyrl: Оила аъзоси}
    how: {en: 'Spouse, or unmarried minor child, of a holder of D-1, D-2, D-4 to D-10, E-1 to E-7, F-2, F-4 or H-2. Families of D-3, E-8, E-9 and E-10 holders cannot get F-3.', ru: 'Супруг(а) или несовершеннолетний ребёнок (не состоящий в браке) обладателя статуса D-1, D-2, с D-4 по D-10, с E-1 по E-7, F-2, F-4 или H-2. Семьи обладателей D-3, E-8, E-9 и E-10 не могут получить F-3.', uz: 'D-1, D-2, D-4 dan D-10 gacha, E-1 dan E-7 gacha, F-2, F-4 yoki H-2 maqomi egasining turmush o‘rtog‘i yoki turmush qurmagan voyaga yetmagan farzandi. D-3, E-8, E-9 va E-10 egalarining oilasi F-3 ola olmaydi.', uz-cyrl: 'D-1, D-2, D-4 дан D-10 гача, E-1 дан E-7 гача, F-2, F-4 ёки H-2 мақоми эгасининг турмуш ўртоғи ёки турмуш қурмаган вояга етмаган фарзанди. D-3, E-8, E-9 ва E-10 эгаларининг оиласи F-3 ола олмайди.'}
    next:
    - E-7-1
    - E-2
    - E-1
    - E-3
    - to: E-4
      note: {en: Providing specialised industrial technology at the invitation of a Korean organisation. A change in Korea is possible if your spouse holds E-1–E-7 (not E-6-2); otherwise apply for a new visa from abroad., ru: 'Передача специализированных промышленных технологий по приглашению корейской организации. Смена статуса в Корее возможна, если супруг(а) имеет статус E-1–E-7 (кроме E-6-2); иначе — новая виза из-за рубежа.', uz: 'Koreya tashkiloti taklifi bilan maxsus sanoat texnologiyalarini o‘rgatish. Turmush o‘rtog‘ingiz E-1–E-7 (E-6-2 dan tashqari) maqomiga ega bo‘lsa, Koreyada maqomni o‘zgartirish mumkin; aks holda chet eldan yangi viza kerak.', uz-cyrl: 'Корея ташкилоти таклифи билан махсус саноат технологияларини ўргатиш. Турмуш ўртоғингиз E-1–E-7 (E-6-2 дан ташқари) мақомига эга бўлса, Кореяда мақомни ўзгартириш мумкин; акс ҳолда чет элдан янги виза керак.'}
    - to: E-5
      note: {en: 'Foreign lawyer, accountant, doctor or other professional licensed under Korean law. A change in Korea is possible if your spouse holds E-1–E-7 (not E-6-2); otherwise apply for a new visa from abroad.', ru: 'Иностранный юрист, бухгалтер, врач или другой специалист с лицензией по корейскому закону. Смена статуса в Корее возможна, если супруг(а) имеет статус E-1–E-7 (кроме E-6-2); иначе — новая виза из-за рубежа.', uz: 'Koreya qonuni bo‘yicha litsenziyaga ega xorijiy yurist, buxgalter, shifokor yoki boshqa mutaxassis. Turmush o‘rtog‘ingiz E-1–E-7 (E-6-2 dan tashqari) maqomiga ega bo‘lsa, Koreyada maqomni o‘zgartirish mumkin; aks holda chet eldan yangi viza kerak.', uz-cyrl: 'Корея қонуни бўйича лицензияга эга хорижий юрист, бухгалтер, шифокор ёки бошқа мутахассис. Турмуш ўртоғингиз E-1–E-7 (E-6-2 дан ташқари) мақомига эга бўлса, Кореяда мақомни ўзгартириш мумкин; акс ҳолда чет элдан янги виза керак.'}
    - to: E-6-1
      note: {en: 'Paid work in art, broadcasting or entertainment. A change in Korea is possible if your spouse holds E-1–E-7 (not E-6-2); otherwise apply for a new visa from abroad.', ru: 'Оплачиваемая работа в искусстве, на телевидении или в индустрии развлечений. Смена статуса в Корее возможна, если супруг(а) имеет статус E-1–E-7 (кроме E-6-2); иначе — новая виза из-за рубежа.', uz: 'San’at, teleradio yoki ko‘ngilochar sohada haq to‘lanadigan ish. Turmush o‘rtog‘ingiz E-1–E-7 (E-6-2 dan tashqari) maqomiga ega bo‘lsa, Koreyada maqomni o‘zgartirish mumkin; aks holda chet eldan yangi viza kerak.', uz-cyrl: 'Санъат, телерадио ёки кўнгилочар соҳада ҳақ тўланадиган иш. Турмуш ўртоғингиз E-1–E-7 (E-6-2 дан ташқари) мақомига эга бўлса, Кореяда мақомни ўзгартириш мумкин; акс ҳолда чет элдан янги виза керак.'}
    - D-2-2
    - to: D-10-1
      note: {en: "Bachelor's degree and 60+ points; 1 year in total, 3 years with 80+ points.", ru: 'Диплом бакалавра и 60+ баллов; всего 1 год, при 80+ баллах — 3 года.', uz: 'Bakalavr diplomi va 60+ ball; jami 1 yil, 80+ ball bilan 3 yil.', uz-cyrl: 'Бакалавр дипломи ва 60+ балл; жами 1 йил, 80+ балл билан 3 йил.'}
    - E-7-Y
    - to: F-2-71
      note: {en: Once the F-2-7 family member earns at least 1× GNI., ru: Когда член семьи с F-2-7 зарабатывает не менее 1× ВНД., uz: F-2-7 dagi oila a’zosi kamida 1× GNI ishlaganda., uz-cyrl: F-2-7 даги оила аъзоси камида 1× GNI ишлаганда.}
    - to: F-2-T1
      note: {en: Once your spouse or parent holds F-2-T (Top-Tier resident)., ru: Когда у вашего супруга(и) или родителя есть F-2-T (резидент Top-Tier)., uz: Turmush o‘rtog‘ingiz yoki ota-onangiz F-2-T (Top-Tier rezidenti) olganda., uz-cyrl: Турмуш ўртоғингиз ёки ота-онангиз F-2-T (Top-Tier резиденти) олганда.}
    - F-6-1
    - F-6-2
    - F-5-13
    - F-2-3
    - to: D-2-3
      note: {en: Change of status in Korea with a university admission letter and proof of funds; your work or job-search status ends., ru: Смена статуса в Корее по письму о зачислении в вуз и с подтверждением средств; рабочий статус или статус поиска работы прекращается., uz: Universitetning qabul xati va mablag‘ni tasdiqlovchi hujjatlar bilan Koreyada maqomni o‘zgartirish; ish yoki ish qidirish maqomingiz tugaydi., uz-cyrl: Университетнинг қабул хати ва маблағни тасдиқловчи ҳужжатлар билан Кореяда мақомни ўзгартириш; иш ёки иш қидириш мақомингиз тугайди.}
    - to: D-2-4
      note: {en: Change of status in Korea with a university admission letter and proof of funds; your work or job-search status ends., ru: Смена статуса в Корее по письму о зачислении в вуз и с подтверждением средств; рабочий статус или статус поиска работы прекращается., uz: Universitetning qabul xati va mablag‘ni tasdiqlovchi hujjatlar bilan Koreyada maqomni o‘zgartirish; ish yoki ish qidirish maqomingiz tugaydi., uz-cyrl: Университетнинг қабул хати ва маблағни тасдиқловчи ҳужжатлар билан Кореяда мақомни ўзгартириш; иш ёки иш қидириш мақомингиз тугайди.}
    needs: *id002
  F-6-1:
    name: {en: Spouse of a Korean citizen, ru: Супруг(а) гражданина Кореи, uz: Koreya fuqarosining turmush o‘rtog‘i, uz-cyrl: Корея фуқаросининг турмуш ўртоғи}
    how: {en: "Legal marriage to a Korean citizen and a real home together. The Korean spouse's household needs income of 50% of the national median income (about ₩25.2M a year for 2 people in 2026, more for a bigger household; 5% of savings and property counts); not needed with a child together. You need basic Korean (TOPIK 1) or a shared language.", ru: 'Законный брак с гражданином Кореи и настоящее совместное жильё. Семье супруга-корейца нужен доход 50% от медианного дохода по стране (около ₩25,2 млн в год на 2 человек в 2026 году, для большей семьи — больше; учитываются 5% сбережений и имущества); не нужен при общем ребёнке. Вам нужен базовый корейский (TOPIK 1) или общий язык.', uz: 'Koreya fuqarosi bilan qonuniy nikoh va haqiqiy umumiy uy-joy. Koreyalik turmush o‘rtog‘ingiz oilasining daromadi mamlakat median daromadining 50% bo‘lishi kerak (2026-yilda 2 kishi uchun yiliga taxminan ₩25,2 mln, kattaroq oila uchun ko‘proq; jamg‘arma va mol-mulkning 5% hisobga olinadi); umumiy farzand bo‘lsa, kerak emas. Sizga boshlang‘ich koreys tili (TOPIK 1) yoki umumiy til kerak.', uz-cyrl: 'Корея фуқароси билан қонуний никоҳ ва ҳақиқий умумий уй-жой. Кореялик турмуш ўртоғингиз оиласининг даромади мамлакат медиан даромадининг 50% бўлиши керак (2026 йилда 2 киши учун йилига тахминан ₩25,2 млн, каттароқ оила учун кўпроқ; жамғарма ва мол-мулкнинг 5% ҳисобга олинади); умумий фарзанд бўлса, керак эмас. Сизга бошланғич корейс тили (TOPIK 1) ёки умумий тил керак.'}
    income: {krw: 25.195752, sponsor: true, cuts: [childTogether]}
    next:
    - to: F-5-2
      needs: {spouse: korean, stay: {years: 2, in: [F-6]}}
    - F-6-2
    - F-6-3
    - to: F-1
      needs: {spouse: exKorean}
      note: {en: 'If your marriage has ended and you qualify for neither F-6-2 nor F-6-3, but must stay to settle property division or household affairs: a temporary F-1-6 stay, applied for as an extension of stay. No work.', ru: 'Если брак прекращён и вам не подходят ни F-6-2, ни F-6-3, но нужно остаться для раздела имущества или улаживания семейных дел: временное пребывание F-1-6, оформляется как продление пребывания. Без работы.', uz: 'Nikoh tugagan bo‘lsa va sizga F-6-2 ham, F-6-3 ham to‘g‘ri kelmasa, lekin mol-mulkni bo‘lish yoki uy-ro‘zg‘or ishlarini hal qilish uchun qolishingiz kerak bo‘lsa: vaqtinchalik F-1-6 maqomi, qolish muddatini uzaytirish tartibida beriladi. Ishlash mumkin emas.', uz-cyrl: 'Никоҳ тугаган бўлса ва сизга F-6-2 ҳам, F-6-3 ҳам тўғри келмаса, лекин мол-мулкни бўлиш ёки уй-рўзғор ишларини ҳал қилиш учун қолишингиз керак бўлса: вақтинчалик F-1-6 мақоми, қолиш муддатини узайтириш тартибида берилади. Ишлаш мумкин эмас.'}
    needs: {spouse: korean}
    lang: {topik: 1}
    notes:
    - countries: marriageProgram
      text: {en: 'For your nationality, the Korean spouse must first complete the international marriage guidance programme.', ru: Для вашего гражданства супруг-кореец сначала должен пройти программу по международным бракам., uz: Fuqaroligingiz uchun koreyalik turmush o‘rtog‘ingiz avval xalqaro nikoh bo‘yicha tushuntirish dasturidan o‘tishi kerak., uz-cyrl: Фуқаролигингиз учун кореялик турмуш ўртоғингиз аввал халқаро никоҳ бўйича тушунтириш дастуридан ўтиши керак.}
  F-6-2:
    name: {en: Parent raising a Korean child, ru: 'Родитель, воспитывающий ребёнка', uz: Koreys farzandini tarbiyalayotgan ota-ona, uz-cyrl: Корейс фарзандини тарбиялаётган ота-она}
    how: {en: "Raising in Korea your minor child born of a marriage or a de facto relationship with a Korean citizen, when you are not (or no longer) married to that Korean parent: after a divorce or the spouse's death, or if you never married. While you are married to them, you use F-6-1.", ru: 'Воспитание в Корее вашего несовершеннолетнего ребёнка, рождённого в браке (в том числе фактическом) с гражданином Кореи, если вы не состоите (или больше не состоите) в браке с этим родителем-корейцем: после развода или смерти супруга(и) либо если брака не было. Пока вы состоите с ним (ней) в браке, ваш статус — F-6-1.', uz: 'Koreya fuqarosi bilan nikohdan (shu jumladan rasmiylashtirilmagan nikohdan) tug‘ilgan voyaga yetmagan farzandingizni Koreyada tarbiyalash, agar siz o‘sha koreyalik ota yoki ona bilan nikohda bo‘lmasangiz (yoki endi bo‘lmasangiz): ajrashgandan yoki turmush o‘rtog‘ingiz vafot etgandan keyin yoki nikoh umuman bo‘lmagan bo‘lsa. U bilan nikohda ekansiz, maqomingiz — F-6-1.', uz-cyrl: 'Корея фуқароси билан никоҳдан (шу жумладан расмийлаштирилмаган никоҳдан) туғилган вояга етмаган фарзандингизни Кореяда тарбиялаш, агар сиз ўша кореялик ота ёки она билан никоҳда бўлмасангиз (ёки энди бўлмасангиз): ажрашгандан ёки турмуш ўртоғингиз вафот этгандан кейин ёки никоҳ умуман бўлмаган бўлса. У билан никоҳда экансиз, мақомингиз — F-6-1.'}
    next: [F-5-2]
    needs: {koreanChild: true, spouse: [none, exKorean, f5, foreigner, abroad]}
  F-6-3:
    name: {en: Marriage ended (not your fault), ru: Брак прекращён не по вашей вине, uz: Nikoh sizning aybingizsiz tugagan, uz-cyrl: Никоҳ сизнинг айбингизсиз тугаган}
    how: {en: 'The marriage ended through the Korean spouse''s death, disappearance or fault.', ru: 'Брак прекращён из-за смерти, исчезновения или вины супруга-гражданина Кореи.', uz: 'Nikoh Koreya fuqarosi bo‘lgan turmush o‘rtog‘ining vafoti, bedarak yo‘qolishi yoki aybi bilan tugagan.', uz-cyrl: 'Никоҳ Корея фуқароси бўлган турмуш ўртоғининг вафоти, бедарак йўқолиши ёки айби билан тугаган.'}
    next: [F-5-2]
    needs: {spouse: exKorean}
  F-4:
    name: {en: Overseas Korean, ru: Этнический кореец, uz: Xorijdagi koreys, uz-cyrl: Хориждаги корейс}
    how: {en: 'Ethnic Korean of any nationality: someone who held Korean nationality by birth (including Koreans who emigrated before 1948, such as Koryo-saram) and later took a foreign nationality, or a direct descendant of such a person. Korean nationality gained by naturalisation does not count. Men who gave up Korean nationality without military service: only from the year they turn 41.', ru: 'Этнический кореец любого гражданства: человек, который имел гражданство Кореи по рождению (включая корейцев, эмигрировавших до 1948 года, например корё-сарам) и затем принял иностранное гражданство, или его прямой потомок. Гражданство Кореи, полученное через натурализацию, не считается. Мужчины, отказавшиеся от гражданства Кореи без военной службы, — только с года, когда им исполнится 41.', uz: 'Har qanday fuqarolikdagi etnik koreys: Koreya fuqaroligiga tug‘ilishdan ega bo‘lgan (1948-yilgacha ko‘chib ketgan koreyslar, masalan, koryo-saram ham kiradi) va keyin chet el fuqaroligini olgan shaxs yoki uning to‘g‘ri chiziqdagi avlodi. Naturalizatsiya orqali olingan Koreya fuqaroligi hisobga olinmaydi. Harbiy xizmatsiz Koreya fuqaroligidan chiqqan erkaklar — faqat 41 yoshga to‘ladigan yildan.', uz-cyrl: 'Ҳар қандай фуқароликдаги этник корейс: Корея фуқаролигига туғилишдан эга бўлган (1948-йилгача кўчиб кетган корейслар, масалан, корё-сарам ҳам киради) ва кейин чет эл фуқаролигини олган шахс ёки унинг тўғри чизиқдаги авлоди. Натурализация орқали олинган Корея фуқаролиги ҳисобга олинмайди. Ҳарбий хизматсиз Корея фуқаролигидан чиққан эркаклар — фақат 41 ёшга тўладиган йилдан.'}
    next:
    - F-5-6
    - F-4-R
    - F-5-7
    - F-5-13
    - to: F-5-14
      needs: {korean: true, stay: {years: 4, in: [H-2]}}
      note: {en: 'If you changed from H-2 to F-4 and have worked 4+ years in total (H-2 and F-4 time together) for the same employer in manufacturing, farming or livestock, fishing, care or housekeeping, with a technical qualification or the required wage.', ru: 'Если вы перешли с H-2 на F-4 и проработали в сумме 4+ года (время на H-2 и F-4 вместе) у одного работодателя в производстве, сельском хозяйстве или животноводстве, рыболовстве, уходе или работе по дому, с технической квалификацией или нужным уровнем зарплаты.', uz: 'H-2 dan F-4 ga o‘tgan bo‘lsangiz va bitta ish beruvchida ishlab chiqarish, qishloq xo‘jaligi yoki chorvachilik, baliqchilik, parvarish yoki uy xizmati sohasida jami 4+ yil (H-2 va F-4 dagi vaqt birga) ishlagan bo‘lsangiz, texnik malaka yoki talab qilingan ish haqi bilan.', uz-cyrl: 'H-2 дан F-4 га ўтган бўлсангиз ва битта иш берувчида ишлаб чиқариш, қишлоқ хўжалиги ёки чорвачилик, балиқчилик, парвариш ёки уй хизмати соҳасида жами 4+ йил (H-2 ва F-4 даги вақт бирга) ишлаган бўлсангиз, техник малака ёки талаб қилинган иш ҳақи билан.'}
    - F-6-1
    needs: *id001
    gives: *id001
  F-4-R:
    name: {en: Regional overseas Korean, ru: Этнический кореец (регион), uz: Hududiy xorijdagi koreys, uz-cyrl: Ҳудудий хориждаги корейс}
    how: {en: F-4 holder settling in a depopulating area with a local-government recommendation; people moving there must be under 60., ru: 'Обладатель F-4, переселяющийся в депопулирующий район по рекомендации местных властей; переезжающим — до 60 лет.', uz: Mahalliy hokimiyat tavsiyasi bilan aholisi kamayayotgan hududga ko‘chgan F-4 egasi; ko‘chib keluvchilar 60 yoshgacha., uz-cyrl: Маҳаллий ҳокимият тавсияси билан аҳолиси камаяётган ҳудудга кўчган F-4 эгаси; кўчиб келувчилар 60 ёшгача.}
    next:
    - F-5-6R
    - to: F-5-6
      note: {en: 'Your F-4-R years count as F-4 time: 2+ years plus income of 1× GNI or another option (assets, trade, investment, pension at 60+); KIIP not required.', ru: 'Годы на F-4-R засчитываются как время на F-4: 2+ года и доход 1× ВНД или другой вариант (активы, торговля, инвестиции, пенсия с 60 лет); KIIP не нужен.', uz: 'F-4-R dagi yillar F-4 dagi vaqt sifatida hisoblanadi: 2+ yil va 1× GNI daromad yoki boshqa variant (aktivlar, savdo, investitsiya, 60 yoshdan pensiya); KIIP talab qilinmaydi.', uz-cyrl: 'F-4-R даги йиллар F-4 даги вақт сифатида ҳисобланади: 2+ йил ва 1× GNI даромад ёки бошқа вариант (активлар, савдо, инвестиция, 60 ёшдан пенсия); KIIP талаб қилинмайди.'}
