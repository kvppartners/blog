      note: {en: "Bachelor's degree or higher and 60+ points on the D-10 points table (at least 20 from the basic items); the 80-point rule for the 21 notified countries does not apply when changing from a student status. 60–79 points: 6 months at a time, 1 year in total; 80+ points: 1 year at a time, up to 3 years.", ru: 'Диплом бакалавра или выше и 60+ баллов по балльной таблице D-10 (не менее 20 — за базовые пункты); правило 80 баллов для 21 страны из особого списка не действует при смене студенческого статуса. 60–79 баллов: по 6 месяцев, всего 1 год; 80+ баллов: по 1 году, до 3 лет.', uz: 'Bakalavr yoki undan yuqori diplom va D-10 ball jadvali bo‘yicha 60+ ball (kamida 20 ball asosiy bandlardan); maxsus ro‘yxatdagi 21 davlat uchun 80 ball qoidasi talaba maqomidan o‘tishda qo‘llanmaydi. 60–79 ball: har safar 6 oy, jami 1 yil; 80+ ball: har safar 1 yil, 3 yilgacha.', uz-cyrl: 'Бакалавр ёки ундан юқори диплом ва D-10 балл жадвали бўйича 60+ балл (камида 20 балл асосий бандлардан); махсус рўйхатдаги 21 давлат учун 80 балл қоидаси талаба мақомидан ўтишда қўлланмайди. 60–79 балл: ҳар сафар 6 ой, жами 1 йил; 80+ балл: ҳар сафар 1 йил, 3 йилгача.'}
