# Archive page (content/archive/): official blank forms, copied unchanged into static/forms/
# from the sources below on the date in "updated". Each form: id (its anchor on the page and
# its file names), Korean name, names in four languages, source, files (type, size in bytes,
# the name a download is saved under, optional note). See README.md, "Archive".
# catalog: Visa docs documents (keys of docs in data/visadocs.yaml) that are one of these forms;
# { korea: id } links it only in lists for applications made in Korea.
